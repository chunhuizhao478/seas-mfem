# =====================================================================
#  SCEC TPV6 — bimaterial strike-slip fault, linear slip weakening, run
#  through the Nitsche dynamic-rupture driver (seas_nitsche_dyn_driver;
#  TPV6/TPV7/TPV31 plan rev 1).
#
#  Built from tpv205/configs/tpv205_nitsche.toml (the TPV205 gold deck) with
#  the values of the benchmark description
#  (tpv6/benchmark_document/2007RuthRalphletter2.pdf):
#
#   - Same friction (mu_s 0.677, mu_d 0.525, d_c 0.40 m), background
#     prestress (sigma_XY = +70 MPa, sigma_YY = -120 MPa, tension positive)
#     and 3 km x 3 km nucleation square at 7.5 km depth (81.6 MPa, static)
#     as TPV205; no side patches.  The square's edges are element edges of
#     tpv6/mesh/tpv6_nitsche_*.geo.
#   - Bimaterial: [material] halfspace_across_fault.  The NEAR side of the
#     description (material 2) is the strong rock, vp 6000, vs 3464,
#     rho 2670; the FAR side (material 1) is the weak rock, vp 3750.0,
#     vs 2165.0, rho 2225.0.  With sigma_XY > 0 the Y > 0 block slides towards
#     +X against the Y < 0 block, and SCEC h-slip = u(far) - u(near) > 0
#     along +X (the stations' x2 axis), so the far (weak) side is Y > 0:
#     normal (0, -1, 0) makes the near (strong) side sign(-Y) >= 0, i.e.
#     Y < 0.  The DRDG3D reference and the old SAFS golds (same side
#     choice) both rupture faster towards +X; the 1000 m smoke run checks
#     both signs before any production run.
#   - The whole Y = 0 plane is a mesh surface, so the material interface is
#     conforming outside the fault too; the fault ends at the 30 x 15 km
#     area, which locks it outside (no barrier rules, as TPV205).
#   - Stations: tpv6/stations/tpv6_fault_stations.csv (5 points), written
#     per side ([output.stations] per_side): the description asks for the
#     displacement and velocity of EACH side plus the traction.
#
#  Regularization: Kelvin-Voigt (eta_bar 0.1) and Prakash-Clifton
#  (v* = 1 m/s, L = 0.01 m) as in the TPV205 gold deck.
#
#  Meshes are generated, not committed (from miniapps/seas):
#    gmsh -3 tpv6/mesh/tpv6_nitsche_1000m.geo -format msh22 -o tpv6/mesh/tpv6_nitsche_1000m.msh
#    gmsh -3 tpv6/mesh/tpv6_nitsche_100m.geo  -format msh22 -o tpv6/mesh/tpv6_nitsche_100m.msh
#
#  Scope: Chunhui Zhao, 2026-10-19.
# =====================================================================

[meta]
schema_version = 1
law            = "slip_weakening"
description    = "SCEC TPV6 (bimaterial, linear slip weakening) via the Nitsche dynamic-rupture driver."

[problem]
tag = "tpv6"

# Bimaterial across the Y = 0 plane (see the header for the side choice).
[material]
kind = "halfspace_across_fault"

[material.halfspace_across_fault]
vp_near  = 6000.0
vs_near  = 3464.0
rho_near = 2670.0
vp_far   = 3750.0
vs_far   = 2165.0
rho_far  = 2225.0
x0_x     = 0.0
x0_y     = 0.0
x0_z     = 0.0
n_x      = 0.0
n_y      = -1.0
n_z      = 0.0

# Not used by the halfspace material; kept because the loader requires it.
[material_constant_fallback]
lambda = 32043759360.0
mu     = 32038120320.0
rho    = 2670.0

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

[mesh]
# 1000 m smoke mesh; production overrides with --mesh (100 m).
path  = "tpv6/mesh/tpv6_nitsche_1000m.msh"
order = 1

[velocity]
use_sidecar = false

# Background prestress, global Cauchy tensor (X along strike, Y fault
# normal, Z up), TENSION POSITIVE.
[stress]
kind        = "constant_tensor"
sigma_xx_pa = 0.0
sigma_yy_pa = -120.0e6
sigma_zz_pa = 0.0
sigma_xy_pa = 70.0e6
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[[stress_region]]           # nucleation square, X = 0, 7.5 km depth
x_min_m     = -1500.0
x_max_m     =  1500.0
z_min_m     = -9000.0
z_max_m     = -6000.0
sigma_xx_pa = 0.0
sigma_yy_pa = -120.0e6
sigma_zz_pa = 0.0
sigma_xy_pa = 81.6e6
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[numerics]
cfl            = 0.5
penalty_factor = 1.0
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

[time]
tfinal     = "12s"
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.05s"

[output]
output_dir     = "output_tpv6_nitsche"
restart_prefix = "cp"
paraview_enabled       = true
paraview_fault         = "hdf5"
paraview_fault_dt      = "0.02s"
paraview_fault_zfp_tol = 0.0
paraview_fault_deflate_level = 1
paraview_free_surface  = "off"

# 5 on-fault stations; per_side writes <prefix>_{near,far}side_<name>.dat in
# the DRDG3D column layout (t h-disp h-vel h-stress v-disp v-vel v-stress
# n-disp n-vel n-stress), sides picked by position (near Y < 0, far Y > 0)
# and checked against the material impedance, besides the usual slip file.
[output.stations]
file             = "tpv6/stations/tpv6_fault_stations.csv"
snap_tolerance_m = 700.0
per_side         = true

[friction.slip_weakening]
mu_s_default     = 0.677
mu_d_default     = 0.525
d_c_default      = 0.40
cohesion_default = 0.0

[boundary]
fault_attr      = 103
natural_attrs   = [101]
absorbing_attrs = [105]

[fault_geometry]
ref_normal        = [0.0, -1.0, 0.0]
up                = [0.0,  0.0, 1.0]
kind              = "vertical_strike_slip"
orientation       = "propagated"
pin_by            = "reference"
tangent           = "pointwise"
junction_policy   = "refuse"
pin_min_margin    = 0.1

[hypocenter]
x_m                 = 0.0
y_m                 = 0.0
z_m                 = -7500.0
nucleation_radius_m = 1500.0

[diagnostics]
energy_balance = false

[friction.prakash_clifton]
v_star = 1.0      # m/s
length = 0.01     # m
