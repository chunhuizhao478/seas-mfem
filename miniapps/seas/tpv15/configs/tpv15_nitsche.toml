# =====================================================================
#  SCEC TPV15 — linear slip weakening on a vertical left-lateral main fault
#  with a 30-degree branch, linear elastic, run through the Nitsche
#  dynamic-rupture driver (seas_nitsche_dyn_driver; complex-geometries plan
#  rev 2, phase P4).
#
#  Built from tpv205/configs/tpv205_nitsche.toml (KV kv_eta = 0.1 and
#  Prakash-Clifton, as the Track 2 golds) with the TPV15 values of
#  TPV14_15_Description_v08.pdf:
#
#   - Faults (one tag, 103): main fault on Y = 0, X in [-16, 12] km; branch
#     along (cos 30, -sin 30, 0) from 100 m to 12 km from the junction at
#     the origin (the spec's gap, Q1 (a)); both 15 km deep
#     (tpv15/mesh/tpv15_*.geo).  ref_normal (0, -1, 0) pins the main fault;
#     the branch patch is pinned to n = (-1/2, -sqrt(3)/2, 0), strike
#     s = (sqrt(3)/2, -1/2, 0), so h-slip is positive right-lateral on both.
#   - Prestress (per-fault tensors, plan 10.2; no new option): the
#     background [stress] tensor is the branch's, sigma = -sigma_n n n
#     - h (s n + n s) with sigma_n = 120 MPa and h = -78 MPa (left-lateral):
#     sigma_xx = -97.55, sigma_yy = -22.45, sigma_xy = -90.96 MPa.  A
#     [[stress_region]] box |Y| <= 1 m over the main fault carries the main
#     tensor (sigma_yy = -120, sigma_xy = -70 MPa), and a second box the
#     3 x 3 km nucleation square 8 km left of the junction at 7.5 km depth
#     (sigma_xy = -81.6 MPa, above the static yield 0.677 x 120 = 81.24 MPa,
#     so it nucleates at t = 0).  The branch faces lie at least 50 m off
#     the main plane, so the 1 m boxes never reach them; the square's border
#     is a mesh line.  Boxes are padded by 1 m (inclusive bounds).
#   - Friction: mu_s 0.677, mu_d 0.525, d_0 0.40 m, cohesion 0.
#   - Material: rho 2670, Vs 3464, Vp 6000.
#   - Boundary attributes of the TPV15 meshes: free 101, fault 103,
#     absorbing 105.  No barrier rules: the meshes end the faults at their
#     rectangles.
#   - Stations: tpv15/stations/tpv15_fault_stations.csv (14 points;
#     x2 = distance from the junction along each fault, km).
#
#   - Weakening distance: [slip_weakening_distance] (option O3) "slip_path",
#     the spec's total slip path distance.
#   - Tension: [fault_tension] (option O2) "zero_strength_floor": where the
#     normal stress turns tensile the strength is the cohesion (0), as the
#     spec defines it (tension -> sigma_n = 0, no opening).  Without it the
#     1000 m smoke aborted at t = 5.45 s, on the main fault next to the
#     branch start (X = 78 m, 8.5 km deep).
#
#  Meshes are generated, not committed (from miniapps/seas, pythonenv):
#    gmsh -3 tpv15/mesh/tpv15_1000m.geo -format msh22 -o tpv15/mesh/tpv15_1000m.msh
#    gmsh -3 tpv15/mesh/tpv15_200m.geo  -format msh22 -o tpv15/mesh/tpv15_200m.msh
#  The 1000 m mesh does not resolve the cohesive zone (620 m, plan 10.5):
#  smoke runs only.  Both meshes grade down to 50 m cells at the junction
#  gap, which sets the stable step.  Production uses --mesh with 200 m.
#
#  Scope: Chunhui Zhao, 2026-10-20.
# =====================================================================

[meta]
schema_version = 1
law            = "slip_weakening"
description    = "SCEC TPV15 (linear slip weakening, left-lateral main fault with a 30-degree branch, elastic) via the Nitsche dynamic-rupture driver — per-fault prestress tensors."

[problem]
tag = "tpv15"   # output file prefix; the stations come from [output.stations]

# Material: homogeneous, rho = 2670, cs = 3464, cp = 6000:
#   mu = rho cs^2, lambda = rho (cp^2 - 2 cs^2).
[material_constant_fallback]
lambda = 32043759360.0
mu     = 32038120320.0
rho    = 2670.0

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0     # sigma_min of the Nitsche sigma_n_eff range check

[mesh]
# 1000 m smoke mesh; production overrides with --mesh (200 m).
path  = "tpv15/mesh/tpv15_1000m.msh"
order = 1

[velocity]
use_sidecar = false

# Background prestress = the branch tensor, global frame, TENSION POSITIVE
# (n = (-1/2, -sqrt(3)/2, 0), s = (sqrt(3)/2, -1/2, 0), sigma_n 120 MPa,
# h -78 MPa).
[stress]
kind        = "constant_tensor"
sigma_xx_pa = -97549981.49518621
sigma_yy_pa = -22450018.504813775
sigma_zz_pa = 0.0
sigma_xy_pa = -90961524.22706631
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

# The main fault (Y = 0), left-lateral 70 MPa.  Last match wins: the
# nucleation box below overrides this one.
[[stress_region]]
x_min_m     = -16001.0
x_max_m     =  12001.0
y_min_m     =     -1.0
y_max_m     =      1.0
z_min_m     = -15001.0
sigma_xx_pa = 0.0
sigma_yy_pa = -120.0e6
sigma_zz_pa = 0.0
sigma_xy_pa = -70.0e6
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[[stress_region]]           # nucleation square, X = -8 km, 7.5 km deep
x_min_m     = -9501.0
x_max_m     = -6499.0
y_min_m     =    -1.0
y_max_m     =     1.0
z_min_m     = -9001.0
z_max_m     = -5999.0
sigma_xx_pa = 0.0
sigma_yy_pa = -120.0e6
sigma_zz_pa = 0.0
sigma_xy_pa = -81.6e6
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

# Option O2: zero strength in tension (the law sees max(sigma_n, 0)).
[fault_tension]
mode = "zero_strength_floor"

# Option O3: mu from the slip path int |V| dt, not |slip|.
[slip_weakening_distance]
measure = "slip_path"

[numerics]
cfl            = 0.5        # fraction of C(p) (P3)
penalty_factor = 1.0        # IP penalty scale (Nitsche driver only)
# Kelvin-Voigt damping (Day et al. 2005 A8): beta_e = kv_eta (1/3) (h_e/p) / c_s,e, h_e = 6V/A
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

[time]
tfinal     = "12s"
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.05s"

[output]
output_dir     = "output_tpv15_nitsche"
restart_prefix = "cp"
# Fault ParaView output: ONE <output_dir>/fault.vtkhdf per run.
paraview_enabled       = true
paraview_fault         = "hdf5"
paraview_fault_dt      = "0.02s"
paraview_fault_zfp_tol = 0.0
paraview_fault_deflate_level = 1
paraview_free_surface  = "off"   # the Nitsche driver writes no free-surface slice

# On-fault stations: the committed station file (scripts/make_fault_stations.py),
# each station snapped to the nearest fault node in 3-D; the run aborts if that
# node is farther than snap_tolerance_m (<prefix>_station_snap.txt lists them).
# Every station is at least 1 km from the other fault.
[output.stations]
file             = "tpv15/stations/tpv15_fault_stations.csv"
snap_tolerance_m = 700.0

# Linear slip weakening: mu = mu_s - (mu_s - mu_d) min(slip/d_c, 1).
[friction.slip_weakening]
mu_s_default     = 0.677
mu_d_default     = 0.525
d_c_default      = 0.40
cohesion_default = 0.0

[boundary]
fault_attr      = 103
natural_attrs   = [101]
absorbing_attrs = [105]

[fault_geometry]
ref_normal        = [0.0, -1.0, 0.0]
up                = [0.0,  0.0, 1.0]
kind              = "vertical_strike_slip_branch"
orientation       = "propagated"
pin_by            = "reference"
tangent           = "pointwise"
junction_policy   = "refuse"
pin_min_margin    = 0.1

# Centre of the nucleation square.
[hypocenter]
x_m                 = -8000.0
y_m                 = 0.0
z_m                 = -7500.0
nucleation_radius_m = 1500.0

[diagnostics]
energy_balance = false

# Prakash-Clifton regularization of the normal stress the law sees
# (SeisSol TPV6/7 values, as the validated TPV102 deck).
[friction.prakash_clifton]
v_star = 1.0      # m/s
length = 0.01     # m
