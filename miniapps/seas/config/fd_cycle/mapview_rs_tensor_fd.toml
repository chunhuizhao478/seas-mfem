# mapview_rs_tensor_fd.toml — config/fd_cycle/mapview_rs_fd.toml with the
# prestress of a global stress tensor: [stress] kind = "constant_tensor", its
# traction on every fault DOF by the dynamic operator's own projection
# (domain/fault_stress_projection.hpp, cycle/prestress.hpp
# BuildTensorPrestress).  Chunhui Zhao, 2026-10-29: "test on the rotated
# planar fault line (modified from TPV205-2D) in a certain angle"; "we should
# keep the function the same as in dynamic phase, to make it consistent and
# work for 2D and 3D".  The deck of the rotation run
# tests/2d_inplane/tensor_rotation_run.sh, not a benchmark.
#
# Run from miniapps/seas:
#   mpirun -np N ./seas_fd_cycle_driver --deck config/fd_cycle/mapview_rs_tensor_fd.toml
#
# Everything else is mapview_rs_fd.toml's, except: no
# [friction.rate_state].sigma_n_default (the tensor gives sigma_n), the
# output prefix, and no volume snapshots (an axis-aligned box does not turn
# with the rotated copy of the deck).
#
# Layout (mapview_rs/mesh/mapview_rs.geo): TPV205-2D's, a straight fault
# y = 0, |x| <= 15 km, with two free tips, in the box [-60, 60]^2 km; plane
# strain, the slip in the plane, no free surface.  [fault_geometry] as the
# TPV205-2D deck: ref_normal = [0, -1] pins the oriented normal n = (0, -1)
# (the side y > 0 is the S3 plus side, n points away from it), and
# up = [0, 0, 1] out of the plane puts the slip in the kernel's strike slot,
# s = (1, 0) (derivation 10.2, case A); the dip slot d = -+e_z is an exact
# zero.  The kernel's slip is the jump of the side n points away from (y > 0)
# over the other: slip_s = (u(y > 0) - u(y < 0)) . s, so the plate loading
# below (y > 0 moving along +x) drives slip_s > 0 (right lateral), and
# V_init is +V_p in the strike slot.
#
# Friction: BP5's scalars (b, Dc, V_0, f_0; SCEC BP5 description) so a 500 m
# mesh resolves the process zone (mu Dc / (b sigma_n) = 6 km), with a =
# 0.004 for |x| <= 10 km rising linearly to 0.04 at 12 km, kept to the tips
# at 15 km.
#
# Prestress: the tensor below, uniform: on the fault plane y = 0 (n = (0, -1))
# sigma_n = -sigma_yy = 25 MPa and the shear sigma_xy = 19.490040931338385
# MPa, BP5's steady state at V_p where a = 0.004 (sigma_n a asinh(V_p / (2
# V0) exp(psi_bg / a)), psi_bg = f0 + b ln(V0 / V_p)), so the
# velocity-weakening zone starts at the steady state of mapview_rs_fd.toml;
# sigma_xy > 0 drives the side y > 0 along +x, right lateral, as the plate
# loading.  In the tips (a = 0.04) the same shear is above the steady state
# (13.27 MPa): psi0 balances it at V_p there (1.056 against psi_bg 0.807),
# and the tips creep ahead of the first event.  sigma_xx = -30 MPa acts on
# no fault DOF (it tests that the projection takes the normal's components
# only); sigma_zz plays no part in the in-plane traction.

[meta]
schema_version = 1
law            = "rate_state"
description    = "Map-view rate and state (TPV205-2D layout), switched QD and dynamic regimes (seas_fd_cycle_driver)."

# BP3 / BP5: rho = 2670 kg/m^3, cs = 3.464 km/s, nu = 0.25 (lambda = mu).
[material_constant_fallback]
lambda = 32038120320.0
mu     = 32038120320.0
rho    = 2670.0

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

# 500 m on the fault, in m.  Tags: 3 fault, 5 the four sides; no tag 1 (no
# free surface).
[mesh]
path  = "mapview_rs/mesh/mapview_rs_500m.msh"
order = 1

[velocity]
use_sidecar = false

# The global Cauchy tensor, tension positive (see the header).
[stress]
kind        = "constant_tensor"
sigma_xx_pa = -30.0e6
sigma_yy_pa = -25.0e6
sigma_zz_pa = -25.0e6
sigma_xy_pa = 19490040.931338385
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

# The dynamic regime's numerics, those of the BP3-FD and BP5-FD decks:
# dt = cfl C(p) h_min / (p^2 c_p); Kelvin-Voigt in every element,
# beta_e = kv_eta (1/3) (h_e / p) / c_s with h_e = 4 A / P.
[numerics]
cfl       = 0.5
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

# 1500 yr of 365 days.
[time]
tfinal     = 4.7304e10
dt_initial = 0.01

[output]
output_dir = "."

# The fd_cycle layout (fault 3, natural 1, Dirichlet 5); the mesh has no
# tag 1 face.
[boundary]
fault_attr    = 3
natural_attrs = [1]

[fault_geometry]
ref_normal      = [0.0, -1.0]
up              = [0.0, 0.0, 1.0]
kind            = "vertical_strike_slip"
orientation     = "propagated"
pin_by          = "reference"
tangent         = "pointwise"
junction_policy = "refuse"
pin_min_margin  = 0.1

# BP5's scalars; a, Dc and V_init come from [cycle.fields], sigma_n from the
# tensor.
[friction.rate_state]
a_default       = 0.004
b_default       = 0.03
Dc_default      = 0.14
V_0_default     = 1.0e-6
f_0_default     = 0.6
V_init_default  = 1.0e-9
state_evolution = "aging_law"
eta             = "auto"         # 0.5 sqrt(mu rho) = mu / (2 cs); QD regime only

# The tensor's tau0 and sigma0; psi0 balances them at |V_init| = V_p with
# the local a (no eta V_init): psi0 = a ln[(2 V0 / V_p) sinh(|tau0| /
# (sigma0 a))]; V_init along -tau0.
[cycle]
ic                   = "scec_fd"
switching            = true
qd_radiation_damping = true
mesh_scale           = 1.0
plate_rate           = 1.0e-9
penalty_factor       = 1.0       # both regimes' K

# The BP5-FD switch.
[cycle.switch]
V_on               = 1.0e-2
V_off              = 1.0e-3
T_dwell            = 10.0
T_min              = 0.0
T_max              = 1200.0
max_dynamic_phases = 0

# Every outer face absorbs in the dynamic regime (the UCERF 2D model's
# boundary, Chunhui Zhao 2026-10-27): the four sides are Dirichlet faces,
# so they become walls with the static reaction frozen at each switch
# (hook H3) plus the absorber.
[cycle.absorbing]
faces = "all"

# The QD stages through the stage operators and the discrete Green's
# function; in map view G is packed on the strike slot (the in-plane one).
[cycle.qd]
solver        = "mumps"
petsc_options = "tests/verification/petsc_ts_rk45_tandem.cfg"
ts_atol       = 1.0e-7
ts_rtol       = 1.0e-50
operators     = "matrix"

# Dense G: N_f = 120 at p = 1 on the 500 m mesh.  Every 10000 stages the
# solve path runs too and the largest difference is reported at the end.
[cycle.qd.green]
check_every = 10000

[cycle.prestress]
V_background = 1.0e-9            # the QD kernel's uniform psi before the tensor's psi0
eta_V_init   = false

# The plate motion on the four sides: the half y > 0 moves by +(V_p t / 2) x,
# the half y < 0 by the opposite.  Band 0: no prescribed-slip segment (the
# fault ends in the medium); the step in the side walls' value at y = 0 is
# the plate boundary.
[cycle.loading]
kind         = "plate"
plane_point  = [0.0, 0.0]
plane_normal = [0.0, 1.0]
slip_dir     = [1.0, 0.0]
band         = 0.0

# |V_init| = V_p; its direction is -tau0's (right lateral, the strike slot);
# the dip slot is out of the plane: 0.
[cycle.fields]
V_init_dip = 0.0

# a: 0.004 for |x| <= 10 km, rising linearly to 0.04 at 12 km.
[cycle.fields.a]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 10.0e3
taper   = 2.0e3
inside  = 0.004
outside = 0.04

# Dc = 0.14 m everywhere.
[cycle.fields.Dc]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 0.0
inside  = 0.14
outside = 0.14

[cycle.fields.V_init]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 0.0
inside  = 1.0e-9
outside = 1.0e-9

# Plane coordinates on the fault: x2 = x (along strike), x3 = y.  Rows every
# 0.1 yr (365 days) and every 0.1 s while max V > 1e-3 m/s.
[cycle.output]
prefix          = "mapview_rs_tensor_fd"
fast_V          = 1.0e-3
dt_fast         = 0.1
dt_slow         = 3153600.0
event_V         = 1.0e-3
event_dwell     = 10.0
plane_origin    = [0.0, 0.0]
plane_axis1     = [1.0, 0.0]
plane_axis2     = [0.0, 1.0]
station_sigma_n = true

# On-fault stations every 3 km from -12 to 12 km.
[[cycle.output.station]]
name = "fltst_x-12"
x    = [-12000.0, 0.0]
[[cycle.output.station]]
name = "fltst_x-09"
x    = [-9000.0, 0.0]
[[cycle.output.station]]
name = "fltst_x-06"
x    = [-6000.0, 0.0]
[[cycle.output.station]]
name = "fltst_x-03"
x    = [-3000.0, 0.0]
[[cycle.output.station]]
name = "fltst_x+00"
x    = [0.0, 0.0]
[[cycle.output.station]]
name = "fltst_x+03"
x    = [3000.0, 0.0]
[[cycle.output.station]]
name = "fltst_x+06"
x    = [6000.0, 0.0]
[[cycle.output.station]]
name = "fltst_x+09"
x    = [9000.0, 0.0]
[[cycle.output.station]]
name = "fltst_x+12"
x    = [12000.0, 0.0]

# Off-fault stations (displacement and velocity along x and y) and the
# along-strike profile from tip to tip; the domain A of the source file is
# the whole fault.
[cycle.benchmark]
region_x2       = [-15.0e3, 15.0e3]
region_x3       = [-1.0, 1.0]
rupture_V       = 1.0e-3
profile_dt_slow = 157680000.0
profile_dt_fast = 1.0
profile_sigma_n = true
volume_axes     = [[1.0, 0.0], [0.0, 1.0]]

[[cycle.benchmark.volume_station]]
name = "offst_x+00y+02"
x    = [0.0, 2000.0]
[[cycle.benchmark.volume_station]]
name = "offst_x+00y-02"
x    = [0.0, -2000.0]
[[cycle.benchmark.volume_station]]
name = "offst_x+00y+08"
x    = [0.0, 8000.0]
[[cycle.benchmark.volume_station]]
name = "offst_x+20y+00"
x    = [20000.0, 0.0]

[[cycle.benchmark.profile]]
name       = "strike"
from       = [-15.0e3, 0.0]
to         = [15.0e3, 0.0]
points     = 61
coordinate = "x2"

[cycle.checkpoint]
every_qd_steps = 1000

# Whole-field snapshots: the fault every 10 yr and 0.1 s.
[cycle.snapshots.fault]
dt_qd  = 3.1536e8
dt_dyn = 0.1
