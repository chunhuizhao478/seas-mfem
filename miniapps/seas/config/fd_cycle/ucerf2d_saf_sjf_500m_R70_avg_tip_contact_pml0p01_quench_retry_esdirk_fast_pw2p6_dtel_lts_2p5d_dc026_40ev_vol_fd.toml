# ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_esdirk_fast_pw2p6_dtel_lts_2p5d_dc026_40ev_vol_fd.toml
# — the UCERF 40-event deck with the 2.5D finite-width term and local time
# stepping (Chunhui Zhao, 2026-11-12: "we should work on 2.5D with PML,
# quenching and everything + LTS").  Differences from
# config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_esdirk_fast_pw2p6_dtel_40ev_vol_fd.toml:
#   - the [cycle.finite_width] table (W = 15 km, wa2020, locked reference);
#   - Dc = 0.26 m (was 0.47 m);
#   - the [cycle.lts] table (rate2, static_split), so run it WITHOUT
#     --early-sync (CYCLE_DRIVER_ARGS="--rank-costs");
#   - the output prefix and this header.
# Kept: mesh, stress, a, b, loading, contact, the CFS-PML band with dt_rule =
# "element", the quench, exact_retry, the implicit QD solve, the stations, 40
# dynamic phases, the volume snapshots (run folder on scratch).
# The header of that deck follows.
#
# ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_esdirk_fast_pw2p6_dtel_40ev_vol_fd.toml
# — the UCERF implicit deck with the two QD speed-ups
# (config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_esdirk_fast_fd.toml;
# the model is described in the header of
# config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_esdirk_fd.toml)
# run for 100 events (Chunhui Zhao, 2026-11-11: "the objective is to run
# UCERF 2d plane strain as fast as it can to 100 events").
# Differences from the fast deck:
#   - [cycle.switch] max_dynamic_phases = 100 (was 0) and [time] tfinal
#     5,000,000 yr as a backstop (was 24,500 yr);
#   - no [cycle.snapshots.volume] table; fault snapshots every 2 s in a
#     dynamic phase (was 0.5 s);
#   - [cycle.output] prefix, [meta] description and the run line below.
# This copy adds [cycle.pml] partition_weight = 2.6 for the dynamic step
# (Chunhui Zhao, 2026-11-11: "let's focus on dynamic part speedup now"); run
# it with fd_cycle --early-sync.  The mesh cut differs from the fast 100ev
# deck's, so the results differ at round-off; a restart needs the same key.
# Kept: mesh, stress, friction, loading, contact, the CFS-PML band, the
# quench, exact_retry, [cycle.qd] integrator = "esdirk" with dense_lu =
# "shared" and stage_guess = "extrapolate", the stations.
# Run from miniapps/seas (Vista: jobs/2d_inplane/vista_2d_cycle.sbatch):
#   ibrun ./seas_fd_cycle_driver --deck config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_esdirk_fast_pw2p6_dtel_40ev_vol_fd.toml
#
#
# This copy adds [cycle.pml] dt_rule = "element" (Chunhui Zhao, 2026-11-11:
# "let's focus on dynamic part speedup now"): the dynamic step is the smallest
# of each element's own limit, the band's divided by sqrt(kappa_e), instead of
# the mesh's CFL step / sqrt(kappa_max = 7.6): 2.76 times fewer dynamic steps
# on this mesh.  Differences from ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_esdirk_fast_pw2p6_100ev_fd.toml:
# dt_rule, the output prefix and this header.
#
# This copy is the 40-event test with volume output (Chunhui Zhao, 2026-11-11:
# "as a test we can submit and run UCERF for 40 events and fully test our
# algorithm, let's prepare the deck files for Vista, i still need volume
# output, so put results on scratch").  Differences from
# ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_esdirk_fast_pw2p6_dtel_100ev_fd.toml:
#   - [cycle.switch] max_dynamic_phases = 40 (was 100);
#   - the [cycle.snapshots.volume] table of the fast 24,500 yr deck is back
#     (every 10 s in a dynamic phase, every 10,000 yr in the QD regime, the
#     faults' box): about 35 MB per snapshot, 14.2 GB for the three events of
#     Vista 1133708, so about 190 GB for 40 events (more if the phases are
#     longer).  Run it with the run folder on scratch:
#     CYCLE_RUN_ROOT=$SCRATCH/... (jobs/2d_inplane/vista_2d_cycle.sbatch);
#   - the output prefix, [meta] description and this header.
# Run it with fd_cycle --early-sync (CYCLE_DRIVER_ARGS="--early-sync
# --rank-costs").
#
[meta]
schema_version = 1
law            = "rate_state"
description    = "UCERF3 FM3.1 San Andreas + San Jacinto at 10 km, map view, plane strain, R 70 km smoothed traces (500 m), averaged vertex normals, VS tip zones, no sigma_n' relaxation, a 10 MPa floor (tapered), unilateral contact (fault opening B), CFS-PML band (0.01 Hz) instead of the absorbing faces, V_off 1e-3 m/s with a 300 s dwell under the quench (dynamic relaxation, d auto), exact retry of rejected QD steps, implicit QD fault solve (option I, esdirk) with the shared dense LU and the extrapolated stage first guess, 40 events with volume snapshots."

# rho = 2670 kg/m^3, cs = 3.464 km/s, nu = 0.25 (lambda = mu), cp = 6 km/s.
[material_constant_fallback]
lambda = 32038120320.0
mu     = 32038120320.0
rho    = 2670.0

# Effective stresses go into [stress]; no pore pressure here.
[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

# Fault traces: the 18 sections joined into 5 chains, then smoothed so the
# tangent turns at most 1/R per unit length, R = 70 km (each corner becomes a
# 70 km arc; close corners share one), and resampled every 500 m; at most
# 6.24 km off UCERF.  500 m within 10 km of the faults,
# h = 500 m + 0.1 (d - 10 km) to 5 km; tilted 1394 x 894 km box, walls
# 415 km from every fault point (D415); 325,422 triangles, 1,645 fault
# edges, h_min 194 m, 1.95 M DOFs
# (ucerf2d/mesh/ucerf2d_saf_sjf_500m_tilted_D415km_R70.json).
# Tags: 3 faults, 5 the two long walls, 1 the two ends.
[mesh]
path  = "ucerf2d/mesh/ucerf2d_saf_sjf_500m_tilted_D415km_R70.msh"
order = 1

[velocity]
use_sidecar = false

# Test stress (report section 4): SHmax N7E, effective principal stresses
# from the gamma = 0.8, R0 = 0.8 recipe with the deviatoric part x1.3
# (Chunhui Zhao 2026-10-29, the card "Raise shear: deviatoric x1.3": the
# best-oriented sections start at tau0/sigma_n' 0.55-0.65, first event about
# 10 kyr): S1 = 82.85, S2 = 52.33 (vertical), S3 = 21.82 MPa;
# tension positive.
[stress]
kind        = "constant_tensor"
sigma_xx_pa = -22723874.717053052
sigma_yy_pa = -81940125.28294693
sigma_zz_pa = -52331999.99999999
sigma_xy_pa = -7382134.744727842
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[numerics]
cfl       = 0.5
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

# Run length: 40 dynamic phases ([cycle.switch] max_dynamic_phases);
# tfinal = 5,000,000 yr of 365 days is a backstop (the three events of the
# 24,500 yr deck came at 8,530, 15,980 and 22,158 yr, Vista 1133708).
[time]
tfinal     = 1.5768e14
dt_initial = 0.01

[output]
output_dir = "."

[boundary]
fault_attr    = 3
natural_attrs = [1]

[fault_geometry]
ref_normal      = [0.5442133518280823, 0.8389468562978492]
up              = [0.0, 0.0, 1.0]
kind            = "vertical_strike_slip"
orientation     = "propagated"
pin_by          = "reference"
tangent         = "pointwise"
junction_policy = "refuse"
pin_min_margin  = 0.1
vertex_normals  = "averaged"   # averaged vertex normals (ucerf2d_saf_sjf_fd.toml: "face")

# BP5's scalars; a = 0.004 everywhere (no tip zones for now), Dc = 0.47 m
# uniform (keeps mu Dc / (b sigma_n') >= 6.07 km at sigma_n' up to 82.6 MPa),
# sigma_n' from the tensor.
# Dc = 0.26 m (was 0.47 m), as config/fd_cycle/ucerf2d_saf_sjf_2p5d_dc026_fd.toml:
# with the term every slip patch keeps a stiffness of at least c mu / W =
# 2.52 MPa/m, and Dc = 0.47 m gave creep only (run of 10-30); 0.26 m keeps
# sigma_n' (b - a) / Dc >= 4.54 MPa/m.  L_b = 3.4-6.1 km (6.8-12 cells of 500 m).
[friction.rate_state]
a_default       = 0.004
b_default       = 0.03
Dc_default      = 0.26
V_0_default     = 1.0e-6
f_0_default     = 0.6
V_init_default  = 1.0e-9
state_evolution = "aging_law"
eta             = "auto"

[cycle]
ic                   = "scec_fd"
switching            = true
qd_radiation_damping = true
mesh_scale           = 1.0
plate_rate           = 1.0e-9
penalty_factor       = 1.0
# opt-in sigma_n' floor of the friction law in both regimes (Andy 10-30 card +
# "okay continue"); 10 MPa here (Chunhui Zhao, 2026-11-02: "with 10MPa cap")
sigma_n_floor_pa     = 10.0e6

# Fault opening, version B (fault opening B plan rev 1.1; cycle/fault_opening.hpp):
# full unilateral contact, g >= 0, sigma >= 0, g sigma = 0.  A DOF opens when
# its elastic sigma_n' turns tensile, and carries a gap g: QD solves the open
# set on G with the gap columns; the dynamic regime applies the per-point
# projection (plan eq. 4.4) and the gap rides the fault state as d . n; the
# gap crosses every regime switch and the checkpoint (V7).  Open DOFs leave
# max V and the hand-back guard (as version A); [cycle.qd.green] below is
# required.  floor_taper true: the whole-law taper (plan eq. 6.2, whole-law
# form; RSLawSigmaN): below the floor the law's stress is scaled by
# max(sigma_n', 0) / floor and never below min(floor, max(sigma_n', 0)), for
# any relaxation r (r >= 0: eq. 6.2, as the D9f B6 deck
# D9f_arc08L2p5_h250_avg_floor10_contact).
[cycle.opening]
mode        = "contact"
floor_taper = true

# Dynamic relaxation during the dwell (quench plan rev1; cycle/cycle_config.hpp
# [cycle.quench], commit d9e5443e): once the phase's max V drops below V_q
# (= V_off below) the damping C_q = d M_rho goes on in every element, with
# d = "auto" = 2 pi c_s,min / L_max, the critical damping of the slowest
# shear mode of the box (0.0156 1/s here: decay time 2/d = 128 s), off again
# above V_q or at the phase end.  The term vanishes at rest (the static end
# state is the same) and enters the implicit damped mass (the step is the
# same).  D9f (2026-11-06): a quenched step costs the same; the 100 s dwell's
# jump 1.8e-3 MPa against 5.0e-3 without.
[cycle.quench]
on      = true
d_per_s = "auto"

# The BP5-FD switch; stop after 10 dynamic phases.  T_max 3,600 s: the
# first run of this deck at 52643d1d (Mac, 2026-11-01) stopped at T_max =
# 1,200 s after event 1 (exit 4): afterslip in the NW tip zone of saf1 kept
# max V at 1.74e-3 m/s > V_off, falling about 0.085% per second, so about
# 1,850 s were needed (estimate); run8 (no tip zones) switched back at
# 313.5 s (Chunhui Zhao, 2026-11-02: the card "Cap 3,600 s, 10 s volume,
# 10 events").
[cycle.switch]
V_on               = 1.0e-2
V_off              = 1.0e-3   # this deck: back to 1.0e-3 (the band deck: 1.0e-4); the dwell settles the box
T_dwell            = 300.0   # this deck: 300 s (was 10): the D9f quench test, band + quench, 2026-11-06
T_min              = 0.0
T_max              = 7200.0   # this deck: room for the longer phases (was 3600.0)
max_dynamic_phases = 40   # this deck: stop after 40 dynamic phases (the 100-event deck: 100; the 24,500 yr deck: 0)

# All four faces absorb in the dynamic regime; the long walls keep their
# frozen load (H3).
# This deck: off, the PML band below replaces the absorbing faces.
[cycle.absorbing]
faces = "off"

# Local time stepping of the dynamic regime (LTS with PML design rev1, pieces
# P-a to P-d): rate-2 clusters, the band in one cluster, the change from the
# static state stepped (static_split).  The mesh is cut for the clusters, with
# the band weight of [cycle.pml] partition_weight.  Run without --early-sync.
[cycle.lts]
mode         = "rate2"
static_split = true

# The 2.5D finite-width term (cycle/finite_width.hpp; plan
# finite-width-pml-lts-plan-rev1.pdf): buried calibration, W = 15 km (c =
# 1.178, beta = 790.5 Pa/m^2, decay length 6.37 km).  Substrate: the locked
# reference (Chunhui Zhao's card of 2026-11-13, his choice of 10-30): the term
# acts on slip alone.  With the PML band the walls follow the substrate (wall
# speed factor 1) and the band carries the term's stretch (piece F-a); under
# [cycle.lts] each element steps its own part of the term (piece F-c).
[cycle.finite_width]
W_m         = 15.0e3
calibration = "wa2020"
substrate   = "locked_reference"

# CFS-PML band (PML design plan rev2/rev3, fully-dynamic-pml P1-P4): the
# same settings as the D9f band deck; the walls stay Dirichlet and
# plate-loaded in both regimes.
[cycle.pml]
on           = true
kind         = "cfs"
wall_attrs   = [5, 1]
thickness_km = 150.0   # 30 elements of 5 km
power        = 2
R0           = 1.0e-3
f_alpha_hz   = 0.01
wall_speed_factor = "auto"
# The dynamic step from each element's own penalty factor (cycle/dyn_phase.hpp).
dt_rule = "element"
# The mesh cut shares the band's work between the ranks: METIS weight 1 + 2.6
# on an element inside a band (cycle/pml_partition.hpp).  2.6 is measured:
# San Jacinto alone, Mac, 8 ranks, 410896f5, --rank-costs: 0.63 us per step
# for the band update of a band element against 0.24 us for an element
# outside a band.
partition_weight = 2.6

[cycle.qd]
solver        = "mumps"
# petsc_ts_rk45_tandem.cfg with dt_max 10 yr instead of 0.1 yr (Chunhui
# Zhao 2026-10-29, the card "Raise the QD step cap to 10 yr"): the faults
# start locked and load at about 0.6 kPa/yr, so 0.1 yr meant about 360k
# steps to the first event; RK5(4) stays error controlled.
petsc_options = "ucerf2d/petsc_ts_rk45_ucerf.cfg"
ts_atol       = 1.0e-7
ts_rtol       = 1.0e-50
operators     = "matrix"
# A rejected step's retry starts from a copy of the step's start state, not
# from PETSc's rollback; the whole state is checked for NaN after each step
# (cycle/exact_retry.hpp; this deck's header).
exact_retry   = true
# Option I (cycle/qd_implicit.hpp): the implicit QD fault solve, every
# fault point implicit in every stage of PETSc's arkimex "3" run fully
# implicit, the contact condition inside each stage solve, an open point
# sliding at V = -tau / eta.  petsc_options then gives the step
# controller's options only (its -ts_type is replaced).
integrator    = "esdirk"
# One LU factor of the Newton matrix by all ranks together (ScaLAPACK,
# cycle/par_dense_lu.hpp) instead of the same serial factor on every rank.
dense_lu      = "shared"
# Each stage's Newton starts from the last step's dense output instead of
# from the stage before (cycle/qd_implicit.hpp, StageGuessExtrapolate_).
stage_guess   = "extrapolate"

# Dense G on the strike slot: N_f = 3,290 at p = 1 (2 per fault edge); built
# at every start and restart (no cache in 2D); run8's mesh (N_f 3,288) took
# 116 s on 8 ranks on the Mac.  Contact refuses the solve-path check (it
# does not carry the open set's gap): check_every = 0 (the opening deck: 10000).
[cycle.qd.green]
check_every = 0
block       = 8              # cloud check 10-29: block 64 ran out of memory at 13.2 GB (4 ranks); 8 peaks at 12.4 GB

[cycle.prestress]
V_background = 1.0e-9
eta_V_init   = false

# BP5 wall motion, no creep: the plane through the Parkfield tip along s
# splits the walls; every wall node is >= 432 km from it.  Band 0: no
# prescribed-slip segment (the faults end in the medium).
[cycle.loading]
kind         = "plate"
plane_point  = [-117927.50429603623, -137890.50995349901]
plane_normal = [-0.5442133518280823, -0.8389468562978492]
slip_dir     = [-0.8389468562978492, 0.5442133518280823]
band         = 0.0

[cycle.fields]
V_init_dip = 0.0

# Velocity-strengthening tip zones (f7866c97): d = the distance along the
# point's own fault to its nearer free tip; a = 0.08 for d <= 18 km, linear
# to 0.004 at d = 20 km, 0.004 beyond (b = 0.03).  20 km: the 10-30 tip-zone
# sweep (straight 100 km fault, plane strain, Dc 0.47) ruptured through
# 10 and 15 km zones and stopped in 20 km ones; a = 0.08: the simple case
# T1 (f7866c97), where it stopped all coseismic slip at the tips.  The
# prestress comes from the tensor, not from a: tau0/sigma_n' is 0.05 to 0.57
# in the zones against 0.255 at a = 0.08 and the plate rate, so the parts
# above that creep at first.  saf2 (55.9 km) keeps
# 15.9 km velocity weakening.
[cycle.fields.a]
kind   = "tip_zone"
width  = 20.0e3
taper  = 2.0e3
inside = 0.004
tip    = 0.08

[cycle.fields.Dc]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 0.0
inside  = 0.26
outside = 0.26

[cycle.fields.V_init]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 0.0
inside  = 1.0e-9
outside = 1.0e-9

# Plane coordinates: x2 along e1 (SE, from the Parkfield tip), x3 along e2
# (NE).  Rows every 10 yr while slow, every 0.1 s while max V > 1e-3 m/s.
[cycle.output]
prefix          = "ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_esdirk_fast_pw2p6_dtel_lts_2p5d_dc026_40ev_vol_fd"
# both regimes per fault DOF at every switch back (the jump that stopped run8)
handback_table  = true
fast_V          = 1.0e-3
dt_fast         = 0.1
dt_slow         = 3.1536e8
event_V         = 1.0e-3
event_dwell     = 10.0
plane_origin    = [-117927.50429603623, -137890.50995349901]
plane_axis1     = [0.8389468562978492, -0.5442133518280823]
plane_axis2     = [0.5442133518280823, 0.8389468562978492]
station_sigma_n = true

# On-fault stations: 2 km in from each tip and every 10 km along each chain
# from its north end, 89 in all; name = chain + km along it.
[[cycle.output.station]]
name = "saf3_002.0km"
x    = [279182.0, -381993.2]
[[cycle.output.station]]
name = "saf3_010.0km"
x    = [285067.7, -387411.6]
[[cycle.output.station]]
name = "saf3_020.0km"
x    = [292424.7, -394184.6]
[[cycle.output.station]]
