# bp3_fd_d60_normal.toml — seas_fd_cycle_driver, SCEC BP3-FD, dip 60 deg,
# normal (2D in-plane design rev 3, phase F, gate G4).  The QD and
# dynamic regimes, switched on max V (as the BP5-FD decks).
#
# Run from miniapps/seas:
#   mpirun -np N ./seas_fd_cycle_driver --deck config/fd_cycle/bp3_fd_d60_normal.toml
#
# BP3 (SCEC SEAS description, 1 Oct 2021): plane strain, a free surface,
# a planar fault dipping 60 deg from the surface to the down-dip distance
# W_f = 40 km (rate and state, aging law), creep at V_L below.  The mesh is
# a vertical section (x, y), y up, the surface y = 0; the fault runs from
# (0, 0) down-dip along t_d = (cos 60, -sin 60) and the hanging wall is the
# side x > -y cot 60 (BP3's Omega+), into which the oriented normal
# n = (sin 60, cos 60) points ([fault_geometry] ref_normal = [1, 0] pins
# it, as Tandem's bp3.toml).  With up = [0, 1] in the plane the slip is in
# the dip slot, d = t_d (design 10.2, case B).  The kernel's slip is the
# jump of the side n points away from (the foot wall, BP3's Omega-) over the
# other (phase A's convention, test_2d_dislocation.cpp): slip_d =
# (u_FW - u_HW) . t_d, which is BP3's delta (eq. 6) itself.  Normal
# faulting (the hanging wall down-dip) is slip_d < 0: V_init_dip = -V_p
# below.

[meta]
schema_version = 1
law            = "rate_state"
description    = "SCEC BP3-FD, dip 60 deg, normal, switched QD and dynamic regimes (seas_fd_cycle_driver, phase F)."

# BP3 Table 1: rho = 2670 kg/m^3, cs = 3.464 km/s, nu = 0.25 (lambda = mu).
[material_constant_fallback]
lambda = 32038120320.0
mu     = 32038120320.0
rho    = 2670.0

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

# bp3/mesh/bp3.geo at dip 60, 25 m on the fault, in km; mesh_scale below
# converts to m.  Tags: 3 fault (0-40 km down-dip), 5 Dirichlet (the two
# sides and the creep segment below 40 km), 1 natural (surface and bottom).
[mesh]
path  = "bp3/mesh/bp3_d60_25m.msh"
order = 1

[velocity]
use_sidecar = false

# The shear prestress is BuildPrestress's (a = "amax"); only sigma_n is read.
[stress]
kind          = "fault_local_prestress"
tau_strike_pa = 0.0
tau_dip_pa    = 0.0
sigma_n_pa    = 50.0e6

# The dynamic regime's numerics, those of the BP5-FD decks (the kv0p1
# values of tpv102/configs/tpv102_nitsche_pc_p1_kv0p1.toml, plan 6.1):
# dt = cfl C(p) h_min / (p^2 c_p); Kelvin-Voigt (Day et al. 2005 A8) in
# every element, beta_e = kv_eta (1/3) (h_e / p) / c_s with h_e = 4 A / P
# (the triangle's inscribed diameter).
# The penalty is [cycle].penalty_factor, shared with the QD regime.  BP3
# has no normal-stress regularization (eq. 15: sigma_n = sigma_n0 + dsigma),
# so the deck has no [friction.prakash_clifton].
[numerics]
cfl       = 0.5
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

# 1500 yr of 365 days (BP3; Tandem's bp3.toml), dt_initial as the BP5 decks.
[time]
tfinal     = 4.7304e10
dt_initial = 0.01

[output]
output_dir = "."

[boundary]
fault_attr    = 3
natural_attrs = [1]

[fault_geometry]
ref_normal      = [1.0, 0.0]
up              = [0.0, 1.0]
kind            = "dipping_normal"
orientation     = "propagated"
pin_by          = "reference"
tangent         = "pointwise"
junction_policy = "refuse"
pin_min_margin  = 0.1

# BP3 Table 1 scalars; a, Dc and V_init come from [cycle.fields].
[friction.rate_state]
a_default       = 0.010
b_default       = 0.015
Dc_default      = 0.008
V_0_default     = 1.0e-6
f_0_default     = 0.6
V_init_default  = 1.0e-9
sigma_n_default = 50.0e6
state_evolution = "aging_law"
eta             = "auto"         # 0.5 sqrt(mu rho) = mu / (2 cs); QD regime only

# BP3-FD eqs 20-23: u = u' = 0 at t = 0, tau0 = sigma_n a_max asinh(...)
# (no eta V_init) and theta0 by inverting the law at V_init with the local
# a and that tau0: the "scec_fd" IC set with a = "amax" (cycle/prestress.hpp;
# QDPhase::Setup puts BuildPrestress's psi0 in the state).  The QD regime
# carries eta V (BP3-QD's balance) until max V passes V_on; the dynamic
# regime has inertia instead (eq. 1, tau = tau0 + dtau).
[cycle]
ic                   = "scec_fd"
switching            = true
qd_radiation_damping = true
mesh_scale           = 1000.0
plate_rate           = 1.0e-9
penalty_factor       = 1.0       # both regimes' K

# The BP5-FD switch: dynamic once max V > V_on; a phase ends once max V has
# stayed below V_off for T_dwell (the spec's event end), and a phase longer
# than T_max stops the run.  No phase limit: the run switches back to QD and
# continues to tfinal.  The dynamic regime's outer boundary is the QD one:
# Dirichlet sides at x = +-w (w >= 400 km: reflections return to the fault
# after at least 2 w / c_p = 130 s) and the free bottom y = -400 km; BP3-FD's
# Sommerfeld condition (absorbing walls) comes with the fully-dynamic-cycle
# merge, decided by the event-1 wall test (design rev 3, section 6.4).
[cycle.switch]
V_on               = 1.0e-2
V_off              = 1.0e-3
T_dwell            = 10.0
T_min              = 0.0
T_max              = 1200.0
max_dynamic_phases = 0

# The QD stages run through the stage operators and the discrete Green's
# function (QD speed items 1 and 3; 2D since phase F): T = G delta + t T_D,
# the face loops' discretization (test_2d_fault_layout Q1: within 1e-10).
# G needs a linear elastic bulk and loading linear in t, as here.
[cycle.qd]
solver        = "mumps"
petsc_options = "tests/verification/petsc_ts_rk45_tandem.cfg"
ts_atol       = 1.0e-7
ts_rtol       = 1.0e-50
operators     = "matrix"

# Dense G, built at setup by N_f solves: N_f = 3200 at p = 1 on the 25 m
# mesh, 4800 at p = 2.  In 2D its strike rows and columns are zero: they are
# skipped while building and dropped after, so G is kept as 2 N_f x N_f
# (0.16 GB at p = 1, 0.37 GB at p = 2; the build peaks at the full
# 3 N_f x 2 N_f, 0.49 and 1.1 GB).  No cache file.  Every 10000 stages the
# solve path runs too and the largest difference is reported at the end.
[cycle.qd.green]
check_every = 10000

[cycle.prestress]
V_background = 1.0e-9            # psi_bg = f0 + b ln(V0 / V_init)
eta_V_init   = false             # eq. 22: no eta V_init
a            = "amax"            # BP3: a_max = 0.025 in tau0 (design D5)

# The plate motion: the sides x beyond the band move rigidly by
# +-(V_p t / 2) s and the creep segment slips V_p t s, with s down-dip
# (normal) = (cos 60, -sin 60); the plane is the fault's, normal n.
[cycle.loading]
kind         = "plate"
plane_point  = [0.0, 0.0]
plane_normal = [0.8660254037844386, 0.5]
slip_dir     = [0.5, -0.8660254037844386]
band         = 1000.0

# V_init: normal, the hanging wall down-dip at V_p (kernel dip slot, d down-dip).
[cycle.fields]
V_init_dip = -1.0e-9

# a: a0 = 0.010 for down-dip distance x_d < H = 15 km, rising linearly to
# a_max = 0.025 over h = 3 km (BP3 eq. 18); the segment is centred at the
# trace, so its half above the surface lies outside the mesh.
[cycle.fields.a]
center  = [0.0, 0.0]
axis1   = [0.5, -0.8660254037844386]
half1   = 15.0e3
taper   = 3.0e3
inside  = 0.010
outside = 0.025

# Dc = L = 0.008 m everywhere.
[cycle.fields.Dc]
center  = [0.0, 0.0]
axis1   = [0.5, -0.8660254037844386]
half1   = 0.0
inside  = 0.008
outside = 0.008

# The kernel strike slot is out of the plane: 0 everywhere.
[cycle.fields.V_init]
center  = [0.0, 0.0]
axis1   = [0.5, -0.8660254037844386]
half1   = 0.0
inside  = 0.0
outside = 0.0

# Plane coordinates on the fault: x2 = down-dip distance x_d, x3 = 0.
# Rows every 0.1 yr (365 days) and every 0.1 s while max V > 1e-3 m/s
# (BP3 section 4.1); station_sigma_n adds the normal stress column.
[cycle.output]
prefix          = "bp3_fd_d60_normal"
fast_V          = 1.0e-3
dt_fast         = 0.1
dt_slow         = 3153600.0
event_V         = 1.0e-3
event_dwell     = 10.0
plane_origin    = [0.0, 0.0]
plane_axis1     = [0.5, -0.8660254037844386]
plane_axis2     = [0.8660254037844386, 0.5]
station_sigma_n = true

# The 12 on-fault stations of BP3 section 4.1, x = x_d t_d (x_d down-dip).
[[cycle.output.station]]
name = "fltst_dp000"
x    = [0.0, 0.0]
[[cycle.output.station]]
name = "fltst_dp025"
x    = [1250.0000000000002, -2165.0635094610966]
[[cycle.output.station]]
name = "fltst_dp050"
x    = [2500.0000000000005, -4330.127018922193]
[[cycle.output.station]]
name = "fltst_dp075"
x    = [3750.000000000001, -6495.190528383289]
[[cycle.output.station]]
name = "fltst_dp100"
x    = [5000.000000000001, -8660.254037844386]
[[cycle.output.station]]
name = "fltst_dp125"
x    = [6250.000000000002, -10825.317547305482]
[[cycle.output.station]]
name = "fltst_dp150"
x    = [7500.000000000002, -12990.381056766579]
[[cycle.output.station]]
name = "fltst_dp175"
x    = [8750.000000000002, -15155.444566227676]
[[cycle.output.station]]
name = "fltst_dp200"
x    = [10000.000000000002, -17320.508075688773]
[[cycle.output.station]]
name = "fltst_dp250"
x    = [12500.000000000004, -21650.635094610963]
[[cycle.output.station]]
name = "fltst_dp300"
x    = [15000.000000000004, -25980.762113533157]
[[cycle.output.station]]
name = "fltst_dp350"
x    = [17500.000000000004, -30310.88913245535]

# BP3 sections 4.2-4.3: the surface stations (displacement and velocity,
# e2 = (0, -1): disp_2 and vel_2 positive downward) and the slip, shear and
# normal stress profiles at x_d = 0, 0.5, .., 40 km, every 5 yr (365 days)
# and every 1 s while max V > 1e-3 m/s.  The domain A of the source file
# is the rate-and-state fault, 0 <= x_d <= 40 km.
[cycle.benchmark]
region_x2       = [0.0, 40.0e3]
region_x3       = [-1.0, 1.0]
rupture_V       = 1.0e-3
profile_dt_slow = 157680000.0
profile_dt_fast = 1.0
profile_sigma_n = true
volume_axes     = [[1.0, 0.0], [0.0, -1.0]]

# x = 0+ and 0- sit on the fault trace: the limit from the side of +x
# (the hanging wall, BP3's Omega+) and of -x.
[[cycle.benchmark.volume_station]]
name   = "srfst_fn-32"
x      = [-32000.0, 0.0]
[[cycle.benchmark.volume_station]]
name   = "srfst_fn-16"
x      = [-16000.0, 0.0]
[[cycle.benchmark.volume_station]]
name   = "srfst_fn-08"
x      = [-8000.0, 0.0]
[[cycle.benchmark.volume_station]]
name   = "srfst_fn+00"
x      = [0.0, 0.0]
toward = [1.0, 0.0]
[[cycle.benchmark.volume_station]]
name   = "srfst_fn-00"
x      = [0.0, 0.0]
toward = [-1.0, 0.0]
[[cycle.benchmark.volume_station]]
name   = "srfst_fn+08"
x      = [8000.0, 0.0]
[[cycle.benchmark.volume_station]]
name   = "srfst_fn+16"
x      = [16000.0, 0.0]
[[cycle.benchmark.volume_station]]
name   = "srfst_fn+32"
x      = [32000.0, 0.0]

[[cycle.benchmark.profile]]
name       = "dip"
from       = [0.0, 0.0]
to         = [40.0e3, 0.0]
points     = 81
coordinate = "x2"

[cycle.checkpoint]
every_qd_steps = 1000
