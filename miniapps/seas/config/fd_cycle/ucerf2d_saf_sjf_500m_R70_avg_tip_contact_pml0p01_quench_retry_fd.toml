# ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_fd.toml
# — the UCERF quench + exact retry deck
# (config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_quench_retry_fd.toml,
# which stays as it ran at b219d5f4, Vista job 1128544) without the
# sigma_n' relaxation: the base deck of option I (implicit QD fault solve;
# plan "Option I: implementation and test plan", decision P6 and phase I0).
# Chunhui Zhao, 2026-11-09: "let's proceed with implementation, take all
# decisions p1-p6 by recommended items".
# Why: option I solves the contact and the friction law together in every
# stage, with the law's stress max(sigma_n', 0) under the whole-law taper.
# The relaxation r is left out of that system (P6), so the DP5 baseline of
# the comparison (plan T4a) runs without it too.
#
# Differences from ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_quench_retry_fd.toml:
#   - no [cycle.relaxation] table (r = 0 everywhere);
#   - [cycle.output] prefix (no "relax"), [meta] description and the run
#     line below.
# Kept: the 10 MPa floor with the whole-law taper, contact, the CFS-PML
# band, the quench, exact_retry, the DP5 QD integrator, every output.
# Run from miniapps/seas (Vista: jobs/2d_inplane/vista_2d_cycle.sbatch):
#   ibrun ./seas_fd_cycle_driver --deck config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_retry_fd.toml
#
# ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_quench_retry_fd.toml
# — the UCERF quench deck
# (config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_quench_fd.toml,
# which stays as it ran at ac9447a0, Vista job 1127480) with the exact retry
# of rejected QD steps ([cycle.qd] exact_retry, cycle/exact_retry.hpp).
# Chunhui Zhao, 2026-11-07: "let's dig deeper into what causes the
# non-finite value", "approve the crash diagnostic and run it on Vista",
# the card "Pick the fix to prepare for the weak-point crash": "Safe retry
# only", "okay let's proceed with this".
# Why: 1127480 passed both hand-backs and stopped in QD at 12,222 yr with
# DIVERGED_STEP_REJECTED.  The diagnostic restart (d9dcd2b5, Vista 1128426)
# named the point: the sjf1 point at s = 26 km, (178.42, -349.25) km, whose
# sigma_n' had fallen to about 0.1 MPa.  For its last 600 steps the stepper
# kept trying about 1e7 s steps in which this point's sigma_n' went below
# 0 in a trial stage, the whole-law taper gave it zero strength, and it
# slid at tau / eta (errors up to 1.9e17; 342 rejections, each retried at a
# smaller dt).  At step 82624 the trial's last stage overflowed (dpsi/dt =
# Inf); PETSc rejected the step, but its rollback multiplied the Inf by a
# zero weight and left psi = NaN in the state, so all ten retries failed
# down to dt = 3.3 s.  With exact_retry the retry starts from a copy of the
# step's start state instead, and the whole state is checked for NaN after
# each step.
#
# Differences from ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_quench_fd.toml:
#   - [cycle.qd] exact_retry = true;
#   - [meta] description and the run line below.
# The output prefix stays the quench deck's, so this deck continues a copy
# of the 1127480 run folder from its checkpoints (vista_2d_cycle.sbatch with
# the folder as $1, CYCLE_DRIVER_ARGS=--allow-other-commit).
# Run from miniapps/seas (Vista: jobs/2d_inplane/vista_2d_cycle.sbatch):
#   ibrun ./seas_fd_cycle_driver --deck config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_quench_retry_fd.toml
# Everything else as in that deck:
#
# ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_quench_fd.toml — the
# version B contact deck with the CFS-PML band
# (config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_fd.toml, which stays as it
# ran at 59906705, Vista job 1126715) with the switch back at V_off 1e-3 m/s
# after a 300 s dwell under the quench (dynamic relaxation during the dwell,
# [cycle.quench], commit d9e5443e) in place of the ten times quieter V_off
# 1e-4 m/s.
# Chunhui Zhao, 2026-11-06: "once we are sure that smaller wave magnitude V
# will reduce the mismatch, we will stop this run, and focus on quenching
# approach, because this is too slow"; "stop UCERF and submit the D9f
# quench test"; the card of 2026-11-06 10:05 pm PST (this deck = the
# recommended option: band, V_off 1e-3, dwell 300 s, quench).
# Why: the band deck's event 1 (Vista 1126715, 59906705) handed back with a
# jump of 4.7e-4 MPa (largest |tau_qd - tau_dyn|; median -1.1e-5 MPa =
# -5e-4 mu P/A) against 0.066 MPa with the absorbing walls (9c9206be), but
# its dynamic phase lasted 5,751 s (3.2 h on 144 ranks) because the fault's
# afterslip tail falls about like 1/t and V_off 1e-4 waits for it.  The D9f
# quench test (simple_cases/configs/D9f_arc08L2p5_h250_avg_floor10_{,pml0p01_}probe{,_quench}.toml,
# Vista 1127390-1127393, d9e5443e, 2026-11-06) showed that with the band the
# jump is set by the waves still in the box, not by V: it decays by itself
# to about 1e-3 MPa by a 300 s dwell at V_off 1e-3 (the 1e-4 pairs give the
# same 1e-4 level only after 760-1,350 s), and the quench brings the 100 s
# dwell from 5.0e-3 to 1.8e-3 MPa at no extra cost per step; with the walls
# the jump stays at -0.074 MPa at every dwell (the wall offset).  UCERF's
# box is three times larger (a shear wave needs about 400 s to cross it), so
# the dwell is 300 s and the quench is on: an event 1 phase of about 800 s
# instead of 5,751 s.
#
# Differences from ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_fd.toml:
#   - [cycle.switch] V_off = 1e-3 m/s (was 1e-4) and T_dwell = 300 s (was
#     10): the hand-back 300 s after max V last fell below 1e-3 m/s; T_max
#     stays 7,200 s;
#   - [cycle.quench] on, d_per_s "auto" = 2 pi c_s,min / L_max = 0.0156 1/s
#     here (c_s 3,464 m/s, L_max 1,394 km; decay time 2/d = 128 s): the
#     damping C_q = d M_rho in every element while max V < V_q = V_off, off
#     again above V_q or at the phase end;
#   - [meta] description, the output prefix and the run line below.
# Everything else as in that deck:
#
# ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_fd.toml — the
# version B contact deck
# (config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_fd.toml,
# which stays as it ran at 9c9206be) with the CFS-PML band of the
# fully-dynamic-pml work in place of the absorbing faces.
# Chunhui Zhao, 2026-11-06, after the T6 contact run stopped at the event 2
# hand-back: "why in dynamic phase we are still using absorbing? the idea of
# having pml is to avoid this", "do you think we can lower V_off = 1e-4 m/s",
# "can we directly do UCERF", "can we submit the job on Vista".
# Why: the contact run at 9c9206be (Mac, 2026-11-06) stopped at the event 2
# hand-back (exit 7, QD balance 0.040 m/s against V_on 0.01) at the closed
# sjf1 DOF C (204.19, -375.05) km.  The dyn -> QD shear jump there (-1.44 MPa,
# max |dtau| 1.80 MPa, the same as 81ce580a's event 2) is the wall offset:
# QD walls displacement-fixed, the dynamic faces traction-fixed (hook H3).
# The 81ce580a run held C on the hard 10 MPa floor and passed; the
# whole-law taper gives C about 3 MPa, so it slipped back.  The band keeps
# the walls Dirichlet in both regimes (one static problem), which removes
# the jump's cause; the D9f band run (fully-dynamic-pml, 2026-11-04) cut the
# hand-back offset to about W/(W+2dL) of the walls' with no build-up.
# What is left with the band is the slow swing of the box, not settled at a
# hand-back 10 s after V < 1e-3 m/s (hand-back offset explainer rev1); the
# lower V_off ends each phase later (about 2,900 s on event 2's tail), which
# gives the swing time to die.
#
# Differences from ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_fd.toml:
#   - [cycle.absorbing] faces = "off": the band replaces the absorbing
#     faces (the code refuses the two together);
#   - [cycle.pml] on every outer face (walls 5 and ends 1) with the D9f
#     band's settings: 150 km thick (30 elements of 5 km), power 2,
#     R0 1e-3, f_alpha 0.01 Hz, wall speed "auto" (the same block as the
#     fully-dynamic-pml UCERF band deck under review there);
#   - [cycle.switch] V_off = 1e-4 m/s (was 1e-3) and T_max = 7,200 s (was
#     3,600): the hand-back waits until the fault is ten times quieter;
#     event 2's tail fell by about 0.08 % per second, so the phase runs about
#     2,900 s longer (about 5,100 s in all), inside the new T_max;
#   - tfinal = 24,500 yr and max_dynamic_phases = 0: the run goes through
#     event 3 (version A's T6 big event at 22,968.6 yr, 81ce580a's at
#     23,004.5 yr) and its hand-back, then tfinal stops it (a limit N > 0
#     would stop at the end of phase N, before its hand-back);
#   - [meta] description, the output prefix and the run line below.
# Everything else as in that deck:
#
# ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_fd.toml — the version A
# opening deck (config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_relax_open_fd.toml,
# which stays as it ran at 92990400) with fault opening version B: full
# unilateral contact.
# Chunhui Zhao, 2026-11-05: "let's start implementation" (fault opening B
# plan rev 1.1, B6, run T6: UCERF through event 3, the exit-7 hand-back,
# then 10 events); 2026-11-05: "let's queue UCERF 2D plane strain Mac run
# after D9f, if D9f produces reasonble results, then start it"; the card
# "Taper the whole law first" (2026-11-05).
# Why: version A's T6 run of the opening deck (Mac, 92990400) stopped at the
# event 3 hand-back (exit 7): its open points were shear-free with the
# faces glued, the QD open-set solve slid the open patches back, and their
# ends loaded closed neighbours on the floor to V 17.5 m/s.  Version B opens
# them with a gap g >= 0 and zero traction (Signorini), so the open set is
# a contact solve on G with the gap columns in QD and the per-point
# projection (plan eq. 4.4) in the dynamic regime, and g crosses every
# switch and the checkpoint (V7).
#
# Differences from ucerf2d_saf_sjf_500m_R70_avg_tip_relax_open_fd.toml:
#   - [cycle.opening] mode = "contact" (was "shear_free") and
#     floor_taper = true, the whole-law form of plan eq. 6.2 (RSLawSigmaN):
#     below the 10 MPa floor the law sees
#     max((sigma_n' - r) w, min(floor, max(sigma_n', 0))),
#     w = max(sigma_n', 0) / floor, so neither the floor nor the
#     relaxation-held part (r < 0, the T6 flips held 1.7 to 41 MPa at
#     sigma_n' ~ 0) releases shear at opening;
#   - [cycle.qd.green] check_every = 0 (was 10000): contact refuses the
#     solve-path check, which does not carry the open set's gap;
#   - [meta] description, the output prefix and the run line below.
# Everything else as in that deck:
#
# ucerf2d_saf_sjf_500m_R70_avg_tip_relax_open_fd.toml — the relaxation
# deck (config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_relax_fd.toml, which
# stays as it ran at 81ce580a) with fault opening, version A.
# Chunhui Zhao, 2026-11-04: "start version A", "build and test here" (fault
# opening design rev 1.1, test T6; cycle/fault_opening.hpp).
# Why: the relaxation run at 81ce580a (Mac, 2026-11-02) stopped at the event
# 3 hand-back (exit 7): the 17 DOFs above V_on were floored saf1 DOFs with a
# tensile elastic sigma_n'; the floor kept a strength there that the QD
# regime released as back-slip (QD balance 0.27 m/s).  Version A makes a
# tensile DOF shear-free in both regimes and leaves it out of max V, so the
# switch and the hand-back guard see the closed DOFs only.
#
# Differences from ucerf2d_saf_sjf_500m_R70_avg_tip_relax_fd.toml:
#   - [cycle.opening] mode = "shear_free": a DOF whose elastic sigma_n' (no
#     r, no floor) is below 0 is open: shear-free in both regimes (QD: the
#     open-set solve on G; dynamic: V = -X/gamma), psi and r frozen there,
#     out of max V and the hand-back guard; the faces stay glued (sigma_n'
#     stays tensile); the 10 MPa floor acts on closed DOFs only;
#   - [meta] description, the output prefix and the run line below.
# Everything else as in that deck:
#
# ucerf2d_saf_sjf_500m_R70_avg_tip_relax_fd.toml — the R70 deck
# (config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_fd.toml, which stays as
# it ran at 31328e64) with sigma_n' relaxation and a 10 MPa floor.
# Chunhui Zhao, 2026-11-02: "implement the relaxation, test and verify it,
# and apply to UCERF 2D plane strain, with 10MPa cap, and rerun the problem".
# Why: the R70 run at 31328e64 (Mac, 2026-11-02) stopped after 4 events at
# the hand-back guard (exit 7): sjf1 DOFs at the bends sat on the 1 MPa
# floor, and the bend unclamping grew event by event in the QD regime.
#
# Differences from ucerf2d_saf_sjf_500m_R70_avg_tip_fd.toml:
#   - [cycle.relaxation] t_relax_yr = 5,000 (relaxation design rev 0,
#     /mnt/project-files/2d-inplane/relaxation/relaxation-design-rev0.md;
#     Ozawa, Ando & Dunham 2023, eq. 6, normal stress only): the friction
#     law sees sigma0 + dsig - r with dr/dt = (dsig - r) / t_r in the QD
#     regime, r frozen in the dynamic regime; the bulk keeps the elastic
#     stress;
#   - [cycle].sigma_n_floor_pa = 10 MPa (was 1 MPa), the backstop under the
#     relaxation; below the lowest prestress sigma_n' on these traces
#     (52 MPa);
#   - the output prefix (the old run's files are not overwritten).
# Everything else as in that deck:
#
# UCERF3 FM3.1 San Andreas and San Jacinto faults at 10 km depth, plane
# strain in map view, p = 1, QD and dynamic regimes switched on max V:
# config/fd_cycle/ucerf2d_saf_sjf_fd.toml (run8) with the two fixes from
# the simple cases.
# Chunhui Zhao, 2026-11-01: "if all tests pass and results are reasonable, we
# will resume UCERF 2D plane-strain run with the averaged normal and tip VS
# zone fix"; "we can smooth the trace bends if needed".
#
# Differences from ucerf2d_saf_sjf_fd.toml:
#   - mesh: the traces smoothed to a minimum radius of 70 km (build_mesh.py
#     --smooth_R 70e3, --fillet 0), 500 m on the faults: every corner is a
#     70 km arc, at most 6.24 km off UCERF (San Gorgonio Pass;
#     saf1 at most 2.7 km);
#     at most 0.43 deg per fault vertex, 325,422 triangles, 1,645 fault
#     edges (run8: R 10 km fillets, corners left at up to 8.7 deg per
#     vertex); R 70 km: the bend stress at an arc end is about
#     (0.8 to 1.7) mu' D / R (simple cases D7f, D9f, 2026-11-01), about
#     41 MPa per event for run8's 67 m mean slip (81 MPa at its 132 m
#     peak), against 52 to 83 MPa of sigma_n' on these traces;
#   - [fault_geometry] vertex_normals = "averaged" (83eeb186);
#   - [cycle.fields.a] kind = "tip_zone" (f7866c97): a = 0.08 within 18 km of
#     each of the 10 free tips along its own fault, linear to 0.004 at 20 km;
#   - no [cycle.probe] (it ran the first dynamic phase on for up to 240 s);
#   - the run stops after the tenth dynamic phase (run8: 2); tfinal is a
#     backstop;
#   - T_max 3,600 s (run8: 1,200 s) and volume snapshots every 10 s in a
#     dynamic phase (run8: 2 s): see [cycle.switch] and
#     [cycle.snapshots.volume];
#   - on-fault and saf1 off-fault stations moved onto the new traces (same
#     rule; the cities are unchanged); the output prefix.
# Kept: the stress tensor, Dc 0.47, b 0.03, the 1 MPa sigma_n' floor, the
# walls (415 km), the absorbing faces, the QD solver, the snapshots.
#
# Run from miniapps/seas (Vista: jobs/2d_inplane/vista_2d_cycle.sbatch; the
# Mac, 8 ranks):
#   mpirun -np 8 ./seas_fd_cycle_driver --deck config/fd_cycle/ucerf2d_saf_sjf_500m_R70_avg_tip_relax_contact_pml0p01_fd.toml
#
# ucerf2d_saf_sjf_fd.toml starts from config/fd_cycle/mapview_rs_tensor_fd.toml.
#
# Coordinates: azimuthal equidistant about 37.25 N 119.25 W, x east, y
# north, in m.  s = (-0.8389, 0.5442) is N57W, the line through the two San
# Andreas tips (Parkfield -117.9, -137.9 km).  The mesh
# is the map view deck's frame turned so its +x is s and its +y the SW side
# (-e2): ref_normal = e2 (the NE side's normal pointing away from the SW
# side), plane_normal = -e2, slip_dir = s, so the SW half moves +V_p t s / 2
# (NW) and the NE half -V_p t s / 2, right lateral, as in BP5.
#
# Faults: 5 disconnected chains, 18 sections, 823 km, 10 free tips:
#   saf1 Parkfield to San Bernardino S (421 km), saf2 San Gorgonio
#   Pass-Garnet Hill (55.9 km), saf3 Coachella (69.5 km),
#   sjf1 San Bernardino to Clark (173 km), sjf2 Coyote Creek to
#   Superstition Mtn (103 km).
#
[meta]
schema_version = 1
law            = "rate_state"
description    = "UCERF3 FM3.1 San Andreas + San Jacinto at 10 km, map view, plane strain, R 70 km smoothed traces (500 m), averaged vertex normals, VS tip zones, no sigma_n' relaxation, a 10 MPa floor (tapered), unilateral contact (fault opening B), CFS-PML band (0.01 Hz) instead of the absorbing faces, V_off 1e-3 m/s with a 300 s dwell under the quench (dynamic relaxation, d auto), exact retry of rejected QD steps, events 1-3 and their hand-backs."

# rho = 2670 kg/m^3, cs = 3.464 km/s, nu = 0.25 (lambda = mu), cp = 6 km/s.
[material_constant_fallback]
lambda = 32038120320.0
mu     = 32038120320.0
rho    = 2670.0

# Effective stresses go into [stress]; no pore pressure here.
[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

# Fault traces: the 18 sections joined into 5 chains, then smoothed so the
# tangent turns at most 1/R per unit length, R = 70 km (each corner becomes a
# 70 km arc; close corners share one), and resampled every 500 m; at most
# 6.24 km off UCERF.  500 m within 10 km of the faults,
# h = 500 m + 0.1 (d - 10 km) to 5 km; tilted 1394 x 894 km box, walls
# 415 km from every fault point (D415); 325,422 triangles, 1,645 fault
# edges, h_min 194 m, 1.95 M DOFs
# (ucerf2d/mesh/ucerf2d_saf_sjf_500m_tilted_D415km_R70.json).
# Tags: 3 faults, 5 the two long walls, 1 the two ends.
[mesh]
path  = "ucerf2d/mesh/ucerf2d_saf_sjf_500m_tilted_D415km_R70.msh"
order = 1

[velocity]
use_sidecar = false

# Test stress (report section 4): SHmax N7E, effective principal stresses
# from the gamma = 0.8, R0 = 0.8 recipe with the deviatoric part x1.3
# (Chunhui Zhao 2026-10-29, the card "Raise shear: deviatoric x1.3": the
# best-oriented sections start at tau0/sigma_n' 0.55-0.65, first event about
# 10 kyr): S1 = 82.85, S2 = 52.33 (vertical), S3 = 21.82 MPa;
# tension positive.
[stress]
kind        = "constant_tensor"
sigma_xx_pa = -22723874.717053052
sigma_yy_pa = -81940125.28294693
sigma_zz_pa = -52331999.99999999
sigma_xy_pa = -7382134.744727842
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[numerics]
cfl       = 0.5
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

# Run length: 10 dynamic phases (max_dynamic_phases below; Chunhui Zhao,
# 2026-11-01: "can we run for 10 events, which will pass previous stop point
# if the fix works": run8 stopped at its first switch back, the 2.5D
# 50-event run aborted in QD after event 5).  tfinal = 500,000 yr of 365
# days is a backstop (run8's first event came at 12,630 yr; later events
# about 18,000 yr apart at 0.56 kPa/yr, an estimate).
[time]
tfinal     = 7.72632e11   # 24,500 yr of 365 days (this deck; was 1.5768e13)
dt_initial = 0.01

[output]
output_dir = "."

[boundary]
fault_attr    = 3
natural_attrs = [1]

[fault_geometry]
ref_normal      = [0.5442133518280823, 0.8389468562978492]
up              = [0.0, 0.0, 1.0]
kind            = "vertical_strike_slip"
orientation     = "propagated"
pin_by          = "reference"
tangent         = "pointwise"
junction_policy = "refuse"
pin_min_margin  = 0.1
vertex_normals  = "averaged"   # averaged vertex normals (ucerf2d_saf_sjf_fd.toml: "face")

# BP5's scalars; a = 0.004 everywhere (no tip zones for now), Dc = 0.47 m
# uniform (keeps mu Dc / (b sigma_n') >= 6.07 km at sigma_n' up to 82.6 MPa),
# sigma_n' from the tensor.
[friction.rate_state]
a_default       = 0.004
b_default       = 0.03
Dc_default      = 0.47
V_0_default     = 1.0e-6
f_0_default     = 0.6
V_init_default  = 1.0e-9
state_evolution = "aging_law"
eta             = "auto"

[cycle]
ic                   = "scec_fd"
switching            = true
qd_radiation_damping = true
mesh_scale           = 1.0
plate_rate           = 1.0e-9
penalty_factor       = 1.0
# opt-in sigma_n' floor of the friction law in both regimes (Andy 10-30 card +
# "okay continue"); 10 MPa here (Chunhui Zhao, 2026-11-02: "with 10MPa cap")
sigma_n_floor_pa     = 10.0e6

# Fault opening, version B (fault opening B plan rev 1.1; cycle/fault_opening.hpp):
# full unilateral contact, g >= 0, sigma >= 0, g sigma = 0.  A DOF opens when
# its elastic sigma_n' turns tensile, and carries a gap g: QD solves the open
# set on G with the gap columns; the dynamic regime applies the per-point
# projection (plan eq. 4.4) and the gap rides the fault state as d . n; the
# gap crosses every regime switch and the checkpoint (V7).  Open DOFs leave
# max V and the hand-back guard (as version A); [cycle.qd.green] below is
# required.  floor_taper true: the whole-law taper (plan eq. 6.2, whole-law
# form; RSLawSigmaN): below the floor the law's stress is scaled by
# max(sigma_n', 0) / floor and never below min(floor, max(sigma_n', 0)), for
# any relaxation r (r >= 0: eq. 6.2, as the D9f B6 deck
# D9f_arc08L2p5_h250_avg_floor10_contact).
[cycle.opening]
mode        = "contact"
floor_taper = true

# Dynamic relaxation during the dwell (quench plan rev1; cycle/cycle_config.hpp
# [cycle.quench], commit d9e5443e): once the phase's max V drops below V_q
# (= V_off below) the damping C_q = d M_rho goes on in every element, with
# d = "auto" = 2 pi c_s,min / L_max, the critical damping of the slowest
# shear mode of the box (0.0156 1/s here: decay time 2/d = 128 s), off again
# above V_q or at the phase end.  The term vanishes at rest (the static end
# state is the same) and enters the implicit damped mass (the step is the
# same).  D9f (2026-11-06): a quenched step costs the same; the 100 s dwell's
# jump 1.8e-3 MPa against 5.0e-3 without.
[cycle.quench]
on      = true
d_per_s = "auto"

# The BP5-FD switch; stop after 10 dynamic phases.  T_max 3,600 s: the
# first run of this deck at 52643d1d (Mac, 2026-11-01) stopped at T_max =
# 1,200 s after event 1 (exit 4): afterslip in the NW tip zone of saf1 kept
# max V at 1.74e-3 m/s > V_off, falling about 0.085% per second, so about
# 1,850 s were needed (estimate); run8 (no tip zones) switched back at
# 313.5 s (Chunhui Zhao, 2026-11-02: the card "Cap 3,600 s, 10 s volume,
# 10 events").
[cycle.switch]
V_on               = 1.0e-2
V_off              = 1.0e-3   # this deck: back to 1.0e-3 (the band deck: 1.0e-4); the dwell settles the box
T_dwell            = 300.0   # this deck: 300 s (was 10): the D9f quench test, band + quench, 2026-11-06
T_min              = 0.0
T_max              = 7200.0   # this deck: room for the longer phases (was 3600.0)
max_dynamic_phases = 0   # this deck: tfinal stops the run (was 10)

# All four faces absorb in the dynamic regime; the long walls keep their
# frozen load (H3).
# This deck: off, the PML band below replaces the absorbing faces.
[cycle.absorbing]
faces = "off"

# CFS-PML band (PML design plan rev2/rev3, fully-dynamic-pml P1-P4): the
# same settings as the D9f band deck; the walls stay Dirichlet and
# plate-loaded in both regimes.
[cycle.pml]
on           = true
kind         = "cfs"
wall_attrs   = [5, 1]
thickness_km = 150.0   # 30 elements of 5 km
power        = 2
R0           = 1.0e-3
f_alpha_hz   = 0.01
wall_speed_factor = "auto"

[cycle.qd]
solver        = "mumps"
# petsc_ts_rk45_tandem.cfg with dt_max 10 yr instead of 0.1 yr (Chunhui
# Zhao 2026-10-29, the card "Raise the QD step cap to 10 yr"): the faults
# start locked and load at about 0.6 kPa/yr, so 0.1 yr meant about 360k
# steps to the first event; RK5(4) stays error controlled.
petsc_options = "ucerf2d/petsc_ts_rk45_ucerf.cfg"
ts_atol       = 1.0e-7
ts_rtol       = 1.0e-50
operators     = "matrix"
# A rejected step's retry starts from a copy of the step's start state, not
# from PETSc's rollback; the whole state is checked for NaN after each step
# (cycle/exact_retry.hpp; this deck's header).
exact_retry   = true

# Dense G on the strike slot: N_f = 3,290 at p = 1 (2 per fault edge); built
# at every start and restart (no cache in 2D); run8's mesh (N_f 3,288) took
# 116 s on 8 ranks on the Mac.  Contact refuses the solve-path check (it
# does not carry the open set's gap): check_every = 0 (the opening deck: 10000).
[cycle.qd.green]
check_every = 0
block       = 8              # cloud check 10-29: block 64 ran out of memory at 13.2 GB (4 ranks); 8 peaks at 12.4 GB

[cycle.prestress]
V_background = 1.0e-9
eta_V_init   = false

# BP5 wall motion, no creep: the plane through the Parkfield tip along s
# splits the walls; every wall node is >= 432 km from it.  Band 0: no
# prescribed-slip segment (the faults end in the medium).
[cycle.loading]
kind         = "plate"
plane_point  = [-117927.50429603623, -137890.50995349901]
plane_normal = [-0.5442133518280823, -0.8389468562978492]
slip_dir     = [-0.8389468562978492, 0.5442133518280823]
band         = 0.0

[cycle.fields]
V_init_dip = 0.0

# Velocity-strengthening tip zones (f7866c97): d = the distance along the
# point's own fault to its nearer free tip; a = 0.08 for d <= 18 km, linear
# to 0.004 at d = 20 km, 0.004 beyond (b = 0.03).  20 km: the 10-30 tip-zone
# sweep (straight 100 km fault, plane strain, Dc 0.47) ruptured through
# 10 and 15 km zones and stopped in 20 km ones; a = 0.08: the simple case
# T1 (f7866c97), where it stopped all coseismic slip at the tips.  The
# prestress comes from the tensor, not from a: tau0/sigma_n' is 0.05 to 0.57
# in the zones against 0.255 at a = 0.08 and the plate rate, so the parts
# above that creep at first.  saf2 (55.9 km) keeps
# 15.9 km velocity weakening.
[cycle.fields.a]
kind   = "tip_zone"
width  = 20.0e3
taper  = 2.0e3
inside = 0.004
tip    = 0.08

[cycle.fields.Dc]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 0.0
inside  = 0.47
outside = 0.47

[cycle.fields.V_init]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 0.0
inside  = 1.0e-9
outside = 1.0e-9

# Plane coordinates: x2 along e1 (SE, from the Parkfield tip), x3 along e2
# (NE).  Rows every 10 yr while slow, every 0.1 s while max V > 1e-3 m/s.
[cycle.output]
prefix          = "ucerf2d_saf_sjf_500m_R70_avg_tip_contact_pml0p01_quench_fd"
# both regimes per fault DOF at every switch back (the jump that stopped run8)
handback_table  = true
fast_V          = 1.0e-3
dt_fast         = 0.1
dt_slow         = 3.1536e8
event_V         = 1.0e-3
event_dwell     = 10.0
plane_origin    = [-117927.50429603623, -137890.50995349901]
plane_axis1     = [0.8389468562978492, -0.5442133518280823]
plane_axis2     = [0.5442133518280823, 0.8389468562978492]
station_sigma_n = true

