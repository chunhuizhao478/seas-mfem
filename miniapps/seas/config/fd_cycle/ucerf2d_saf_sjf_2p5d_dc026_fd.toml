# Map view: the whole 2D domain is the horizontal plane, so the "surface"
# output is the volume snapshot (displacement and velocity, east and north,
# float64, 3 points per triangle).  Box = the faults' extent plus 100 km:
# 243,684 triangles, about 35 MB per snapshot; every 2 s in a dynamic phase
# (Nyquist 0.25 Hz; about 4.4 GB for a 250 s phase) and every 10,000 yr in
# the QD regime (Chunhui Zhao, 2026-10-29: "this is too much, we need to
# reduce the size", "the sampling frequency", "let's do 2s").  About 90 GB
# for 20 events with everything else.
[cycle.snapshots.volume]
