# ucerf2d_saf_sjf_2p5d_dc026_fd.toml — ucerf2d_saf_sjf_2p5d_fd.toml with Dc =
# 0.26 m instead of 0.47 m and the 1 MPa sigma_n' floor back on.  The 2.5D
# run at a4a56fcf (8 ranks, Mac, 10-30) had no event: the faults crept
# about 2 m to 14,500 yr and the QD solve died where sigma_n' reached 0 at
# (177, -348) km.  With the term every slip patch keeps a stiffness of at
# least c mu / W = 2.52 MPa/m (W = 15 km, wa2020), and rate and state needs
# less than sigma_n' (b - a) / Dc for an instability: 2.8 MPa/m at 50 MPa
# with Dc = 0.47 m, and below 2.52 MPa/m wherever sigma_n' < 45.4 MPa.
#
# Dc = 0.26 m is BP5's Dc scaled by the faults' LOWEST sigma_n' (0.14 x
# 45.4 / 25 = 0.254, rounded up), where 0.47 m was set by the highest (L_b
# >= 6.07 km at 82.6 MPa): sigma_n' (b - a) / Dc >= 4.54 MPa/m everywhere
# (BP5: 4.64), so every stretch is at least as unstable as BP5's against
# the 2.52 MPa/m of the term.  The cost is resolution: L_b = mu Dc / (b
# sigma_n') = 3.4-6.1 km (6.8-12 cells of 500 m at p = 1) instead of
# 6.1-11 km.  The floor stays because the sharp-bend decks showed the term
# does not change the kink's sigma_n' per metre of slip; it only bounds the
# slip per event (W dtau / (c mu), a few m, against run8's 67 m mean).
#
# Differences to ucerf2d_saf_sjf_2p5d_fd.toml: Dc (the default and the
# [cycle.fields.Dc] field), [cycle] sigma_n_floor_pa = 1 MPa (run8's), the
# output prefix.  Chunhui Zhao's card of 10-30 picks this deck or not.
#
# Run from miniapps/seas:
#   mpirun -np 8 ./seas_fd_cycle_driver --deck config/fd_cycle/ucerf2d_saf_sjf_2p5d_dc026_fd.toml
#
# The 2.5D deck's notes follow.
#
# ucerf2d_saf_sjf_2p5d_fd.toml — ucerf2d_saf_sjf_fd.toml with the 2.5D
# finite-width term ([cycle.finite_width], cycle/finite_width.hpp) and
# WITHOUT the sigma_n' floor: does the finite seismogenic width keep sigma_n'
# positive at the San Andreas bends and pass the hand-back where run7
# (plane strain, no floor) stopped at sigma_n' < 0 and run8 (floor 1 MPa)
# stopped at its first switch back?  Chunhui Zhao, 2026-10-30: "does 2.5D
# model solve the issues we have ... test this directly locally using
# designed bended fault and UCERF fault"; the floor off (derivation note
# /mnt/project-files/2d-inplane/nonplanar-literature/inplane-2p5d-derivation-rev8.pdf,
# Section 7.4); substrate "locked_reference" (the card of 10-30 16:58Z): while
# the faults are locked the loading is run8's, and the term acts on slip
# alone (valid for the first events only).
#
# Differences to ucerf2d_saf_sjf_fd.toml: no [cycle] sigma_n_floor_pa, the
# [cycle.finite_width] table (W = 15 km, wa2020: c = 1.178, beta = 790.5
# Pa/m^2, decay length 6.37 km), the output prefix, and tfinal (a backstop
# of 1e12 s: the first event may move; max_dynamic_phases = 2 stops the run).
# Everything else is run8's, so the hand-back tables and the bend-vertex
# sigma_n' compare one to one.
#
# Run from miniapps/seas, at a commit with [cycle.finite_width]:
#   mpirun -np 8 ./seas_fd_cycle_driver --deck config/fd_cycle/ucerf2d_saf_sjf_2p5d_fd.toml
#
# The plane-strain deck's notes follow.
#
# ucerf2d_saf_sjf_fd.toml — seas_fd_cycle_driver on the UCERF3 FM3.1 San Andreas
# and San Jacinto faults, a horizontal slice at 10 km depth, plane strain in
# map view, p = 1, quasi-dynamic and dynamic regimes switched on max V.  The
# first TEST deck of the UCERF 2D model (report
# /mnt/project-files/ucerf-2d/ucerf-faults-2d-rev14.pdf).
# Chunhui Zhao, 2026-10-29: "let's not add this for now" (the 20 km
# velocity-strengthening tip zones), "what else we need to do before we
# prepare a test run".
#
# Runs (cloud, 4 ranks): run7 (e7c8e5ff, 10-30) stopped 27 s into event 1,
# sigma_n' < 0 at a 1.5 deg bend of saf1; run8 (+ [cycle] sigma_n_floor_pa =
# 1 MPa) finished the dynamic phase (313.5 s, 90,930 steps, 1 h 47 min in
# all) and stopped at its first switch back: max V dynamic 7.8e-5 m/s, QD
# balance 0.253 m/s (plan 6.3's guard, exit 7).  This deck is run8's with
# the paths in the repo, [cycle.output] handback_table = true and
# [cycle.probe], for the rerun on the Mac (Chunhui Zhao, 2026-10-30: the card
# "Floor commit, then UCERF table").
#
# Run from miniapps/seas, at 2d-inplane with [cycle] sigma_n_floor_pa or
# later:
#   mpirun -np 4 ./seas_fd_cycle_driver --deck config/fd_cycle/ucerf2d_saf_sjf_fd.toml
#
# Starts from config/fd_cycle/mapview_rs_tensor_fd.toml (the map-view tensor
# deck); differences: the mesh, the tensor, Dc, a uniform (no tip zones),
# the loading plane, the output plane and stations, the run length.
#
# Coordinates: azimuthal equidistant about 37.25 N 119.25 W, x east, y
# north, in m.  s = (-0.8389, 0.5442) is N57W, the line through the two San
# Andreas tips (Parkfield -117.9, -137.9 km).  The mesh
# is the map view deck's frame turned so its +x is s and its +y the SW side
# (-e2): ref_normal = e2 (the NE side's normal pointing away from the SW
# side), plane_normal = -e2, slip_dir = s, so the SW half moves +V_p t s / 2
# (NW) and the NE half -V_p t s / 2, right lateral, as in BP5.
#
# Faults: 5 disconnected chains, 18 sections, 823 km, 10 free tips:
#   saf1 Parkfield to San Bernardino S (421 km), saf2 San Gorgonio
#   Pass-Garnet Hill (56 km), saf3 Coachella (69 km),
#   sjf1 San Bernardino to Clark (173 km), sjf2 Coyote Creek to
#   Superstition Mtn (103 km).
#
# CHECKS listed before the first (cloud) run:
#   - map-view QD with several disconnected faults and free tips (never run)
#   - the orientation pin: each chain's mean normal against ref_normal must
#     be >= pin_min_margin (0.1); measured on the traces |mean n . e2| =
#     0.95 to 0.99 for the five chains, so the pin is safe
#   - San Gorgonio Pass: 13 km of left-lateral resolved shear; V_init follows
#     -tau0 there (left lateral), the code takes it
#   - the time to build G (N_f = 3,354 columns on 3.57 M DOFs)
#   - [cycle.benchmark] with the plane coordinates below on curved faults

[meta]
schema_version = 1
law            = "rate_state"
description    = "UCERF3 FM3.1 San Andreas + San Jacinto at 10 km, map view, switched QD and dynamic regimes (test deck)."

# rho = 2670 kg/m^3, cs = 3.464 km/s, nu = 0.25 (lambda = mu), cp = 6 km/s.
[material_constant_fallback]
lambda = 32038120320.0
mu     = 32038120320.0
rho    = 2670.0

# Effective stresses go into [stress]; no pore pressure here.
[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

# Fault traces rounded at every corner with R = 10 km arcs (49 corners,
# at most 0.36 km off UCERF; Chunhui Zhao 2026-10-29 "yes let's build this
# mesh" after the QD abort at a 10.5 deg corner of sjf1).  500 m within
# 10 km of the faults, h = 500 m + 0.1 (d - 10 km) to 5 km;
# tilted 1393 x 893 km box, walls 415 km from every fault point (D415);
# 326,130 triangles, 1,644 fault edges, at most 0.44 km off UCERF after
# rounding (ucerf2d/mesh/*_f10.json).  Tags: 3 faults, 5 the two long walls,
# 1 the two ends.
[mesh]
path  = "ucerf2d/mesh/ucerf2d_saf_sjf_500m_tilted_D415km_f10.msh"
order = 1

[velocity]
use_sidecar = false

# Test stress (report section 4): SHmax N7E, effective principal stresses
# from the gamma = 0.8, R0 = 0.8 recipe with the deviatoric part x1.3
# (Chunhui Zhao 2026-10-29, the card "Raise shear: deviatoric x1.3": the
# best-oriented sections start at tau0/sigma_n' 0.55-0.65, first event about
# 10 kyr): S1 = 82.85, S2 = 52.33 (vertical), S3 = 21.82 MPa;
# tension positive.
[stress]
kind        = "constant_tensor"
sigma_xx_pa = -22723874.717053052
sigma_yy_pa = -81940125.28294693
sigma_zz_pa = -52331999.99999999
sigma_xy_pa = -7382134.744727842
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[numerics]
cfl       = 0.5
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

# Run length: 20 events (Chunhui Zhao, 2026-10-29: "I think 20 events at a
# start would be sufficient"), stopped by max_dynamic_phases below; tfinal
# = 500,000 yr of 365 days is only a backstop (first events after about
# 32,000 to 88,000 yr, then about 18,000 yr apart at 0.56 kPa/yr).
[time]
tfinal     = 1.0e12       # backstop; run8 used 4.30e11 (run7 switched at 3.984e11 s)
dt_initial = 0.01

[output]
output_dir = "."

[boundary]
fault_attr    = 3
natural_attrs = [1]

[fault_geometry]
ref_normal      = [0.5442133518280823, 0.8389468562978492]
up              = [0.0, 0.0, 1.0]
kind            = "vertical_strike_slip"
orientation     = "propagated"
pin_by          = "reference"
tangent         = "pointwise"
junction_policy = "refuse"
pin_min_margin  = 0.1

# BP5's scalars; a = 0.004 everywhere (no tip zones for now), Dc = 0.47 m
# uniform (keeps mu Dc / (b sigma_n') >= 6.07 km at sigma_n' up to 82.6 MPa),
# sigma_n' from the tensor.
[friction.rate_state]
a_default       = 0.004
b_default       = 0.03
Dc_default      = 0.26
V_0_default     = 1.0e-6
f_0_default     = 0.6
V_init_default  = 1.0e-9
state_evolution = "aging_law"
eta             = "auto"

[cycle]
ic                   = "scec_fd"
switching            = true
qd_radiation_damping = true
mesh_scale           = 1.0
plate_rate           = 1.0e-9
penalty_factor       = 1.0
# opt-in sigma_n' floor of the friction law in both regimes (run8's 1 MPa)
sigma_n_floor_pa     = 1.0e6

# The 2.5D term: buried calibration (Chunhui Zhao, 2026-10-30: "we will for
# 2d in plane, only focus on buried fault for now"), W = 15 km.  Kelvin-Voigt
# damps K alone, not beta (the note's rule C3; the code's only choice, also
# in the run log).
[cycle.finite_width]
W_m         = 15.0e3
calibration = "wa2020"
substrate   = "locked_reference"

# The BP5-FD switch; stop after 20 dynamic phases (for the cloud check,
# lower it to 1).
[cycle.switch]
V_on               = 1.0e-2
V_off              = 1.0e-3
T_dwell            = 10.0
T_min              = 0.0
T_max              = 1200.0
max_dynamic_phases = 2

# The switch probe of plan P3 (Chunhui Zhao, 2026-10-30: "let's continue
# investigation until a possible reason and fix is identified and tested"):
# at run8's switch back a wave of 0.29 m/s (about 2.7 MPa of S-wave stress)
# was still crossing the NW end of saf1.  The first dynamic phase runs on
# until each T_dwell below would have switched back, and the QD balance is
# solved there (_switch_probe.txt and the log); the run itself still
# switches back with [cycle.switch]'s pair, at run8's state, and writes the
# hand-back table there.
[cycle.probe]
V_off   = [1.0e-3]
T_dwell = [10.0, 30.0, 60.0, 120.0, 240.0]

# All four faces absorb in the dynamic regime; the long walls keep their
# frozen load (H3).
[cycle.absorbing]
faces = "all"

[cycle.qd]
solver        = "mumps"
# petsc_ts_rk45_tandem.cfg with dt_max 10 yr instead of 0.1 yr (Chunhui
# Zhao 2026-10-29, the card "Raise the QD step cap to 10 yr"): the faults
# start locked and load at about 0.6 kPa/yr, so 0.1 yr meant about 360k
# steps to the first event; RK5(4) stays error controlled.
petsc_options = "ucerf2d/petsc_ts_rk45_ucerf.cfg"
ts_atol       = 1.0e-7
ts_rtol       = 1.0e-50
operators     = "matrix"

# Dense G on the strike slot: N_f = 3,354 at p = 1; built at every start
# and restart (no cache in 2D), 14.4 min on 4 ranks.
[cycle.qd.green]
check_every = 10000
block       = 8              # cloud check 10-29: block 64 ran out of memory at 13.2 GB (4 ranks); 8 peaks at 12.4 GB

[cycle.prestress]
V_background = 1.0e-9
eta_V_init   = false

# BP5 wall motion, no creep: the plane through the Parkfield tip along s
# splits the walls; every wall node is >= 432 km from it.  Band 0: no
# prescribed-slip segment (the faults end in the medium).
[cycle.loading]
kind         = "plate"
plane_point  = [-117927.50429603623, -137890.50995349901]
plane_normal = [-0.5442133518280823, -0.8389468562978492]
slip_dir     = [-0.8389468562978492, 0.5442133518280823]
band         = 0.0

[cycle.fields]
V_init_dip = 0.0

# a = 0.004 everywhere (uniform: half1 = 0, inside = outside).
[cycle.fields.a]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 0.0
inside  = 0.004
outside = 0.004

[cycle.fields.Dc]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 0.0
inside  = 0.26
outside = 0.26

[cycle.fields.V_init]
center  = [0.0, 0.0]
axis1   = [1.0, 0.0]
half1   = 0.0
inside  = 1.0e-9
outside = 1.0e-9

# Plane coordinates: x2 along e1 (SE, from the Parkfield tip), x3 along e2
# (NE).  Rows every 10 yr while slow, every 0.1 s while max V > 1e-3 m/s.
[cycle.output]
prefix          = "ucerf2d_saf_sjf_2p5d_dc026_fd"
# both regimes per fault DOF at every switch back (the jump that stopped run8)
handback_table  = true
fast_V          = 1.0e-3
dt_fast         = 0.1
dt_slow         = 3.1536e8
event_V         = 1.0e-3
event_dwell     = 10.0
plane_origin    = [-117927.50429603623, -137890.50995349901]
plane_axis1     = [0.8389468562978492, -0.5442133518280823]
plane_axis2     = [0.5442133518280823, 0.8389468562978492]
station_sigma_n = true

# On-fault stations: 2 km in from each tip and every 10 km along each chain
