[cycle.checkpoint]
every_qd_steps = 1000

# The fault every 100 yr and every 0.5 s in a dynamic phase.
[cycle.snapshots.fault]
dt_qd  = 3.1536e9
dt_dyn = 0.5

# Map view: the whole 2D domain is the horizontal plane, so the "surface"
# output is the volume snapshot (displacement and velocity, east and north,
# float64, 3 points per triangle).  Box = sjf1's extent plus 100 km; every
# 10 s in a dynamic phase and every 10,000 yr in the QD regime.
[cycle.snapshots.volume]
dt_qd   = 3.1536e11
dt_dyn  = 10.0
box_min = [60000.0, -539000.0]
box_max = [395000.0, -230000.0]
