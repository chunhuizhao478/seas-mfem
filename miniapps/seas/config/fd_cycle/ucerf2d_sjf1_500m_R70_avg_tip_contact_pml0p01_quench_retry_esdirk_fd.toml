# Off-fault stations (u and v along east and north): six cities (no basin
# structure in the model).  Domain A of the source time series: sjf1, in
# plane coordinates, with 20 km margins.  No profile (the fault is not
# straight).
[cycle.benchmark]
region_x2       = [318000.0, 530000.0]
region_x3       = [-50000.0, 11000.0]
rupture_V       = 1.0e-3
profile_dt_slow = 3.1536e9
profile_dt_fast = 1.0
profile_sigma_n = true
volume_axes     = [[1.0, 0.0], [0.0, 1.0]]
[[cycle.benchmark.volume_station]]
name = "los_angeles"
x    = [92755.0, -355098.2]
[[cycle.benchmark.volume_station]]
