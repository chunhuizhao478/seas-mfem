# =========================================================================
# LOCAL SRW-in-QD smoke: bp5_phase5_50step.toml + strong rate weakening.
# =========================================================================
# Exercises the FULL SRW chain end-to-end on the (local) BP5 mesh:
#   resolver fills per-DOF rs.V_w -> SetRateStatePerDOF -> geom.V_w_values_ ->
#   RateStateFaultOperator builds with SlipLawSRWPsi (production) -> 4-phase init
#   -> ComputeRHS evolves psi via the per-DOF _SRW route.  Same uniform
#   prestress/friction as the aging-law sibling, so the equilibrium init is
#   identical; only the state evolution differs.  NOT physics validation — a
#   local smoke that the SRW path constructs, initialises (<1e-6), and advances.
#   Run:  ./seas_spatial_seas_driver --config <this> --max-steps 5

[meta]
schema_version = 1
law            = "rate_state"
description    = "Local SRW-in-QD smoke: uniform friction + fault-local prestress + slip_law_srw."

[material_constant_fallback]
lambda = 32.038120320e9
mu     = 32.038120320e9
rho    = 2670.0

[mesh]
path  = "bp5/mesh/reference/bp5_tandem_exact_meters.msh"
order = 1

[velocity]
use_sidecar = false

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

[stress]
kind          = "fault_local_prestress"
sigma_n_pa    = 50.0e6
tau_strike_pa = 3.0e7
tau_dip_pa    = 0.0

[numerics]

[time]
tfinal        = 3.15e11
rk45_atol     = 1.0e-7
rk45_rtol     = 1.0e-50
dt_init       = -1.0
dt_max_years  = 0.1

[solver]
type            = "cg_amg"
ksp_rtol        = 1.0e-8
amg_print_level = 0
residual_check  = true

[output]
output_dir   = "."
bp5_stations = false

[boundary]
fault_attr      = 3
natural_attrs   = [1]
dirichlet_attrs = [5]

[friction.rate_state]
state_evolution = "slip_law_srw"   # <-- the SRW path under test
f_w_default     = 0.1
V_w_default     = 0.1
f_0_default     = 0.6
V_0_default     = 1.0e-6
eta             = "auto"
a_default       = 0.010
b_default       = 0.015
Dc_default      = 0.004
V_init_default  = 1.0e-9
sigma_n_default = 50.0e6
