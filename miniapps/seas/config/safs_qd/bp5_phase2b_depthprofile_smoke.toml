# =========================================================================
# Phase 2b construction smoke — spatial_seas (quasi-dynamic) driver,
# HETEROGENEOUS depth-profile material.
# =========================================================================
# Same as bp5_phase2_smoke.toml but with a 2-layer depth-profile (1-D)
# material instead of the constant fallback.  Exercises the Phase-2b path:
# MaterialField::Mode::Coefficient (depth-profile FunctionCoefficients) ->
# the IP per-qp coefficient ElasticityDomainOperator ctor (Stage 1b).
# NOT a physics run — no time loop yet (dry-run constructs + exits).
#
# Run (from miniapps/seas):
#   ./seas_spatial_seas_driver --config config/safs_qd/bp5_phase2b_depthprofile_smoke.toml --dry-run
#   mpirun -np 4 ./seas_spatial_seas_driver --config config/safs_qd/bp5_phase2b_depthprofile_smoke.toml --dry-run

[meta]
schema_version = 1
law            = "rate_state"
description    = "Phase 2b construction smoke: BP5 mesh, 2-layer depth-profile material, cg_amg. No time loop."

[material]
# Heterogeneous: 1-D depth profile (depth = max(0, -z) for axis 'z').
kind       = "depth_profile_1d"
depth_axis = "z"

[[material_profile.layer]]
# Upper layer 0–10 km: BP5-like moduli (vs=3464 => mu≈32.0 GPa at rho=2670).
depth_top_m = 0.0
depth_bot_m = 10000.0
vp_ms       = 6000.0
vs_ms       = 3464.0
rho_kgm3    = 2670.0
interp      = "constant"

[[material_profile.layer]]
# Lower layer 10–60 km: stiffer/denser (heterogeneity vs layer 0).
depth_top_m = 10000.0
depth_bot_m = 60000.0
vp_ms       = 7000.0
vs_ms       = 4041.0
rho_kgm3    = 2900.0
interp      = "constant"

[material_constant_fallback]
# Retained as the fallback (unused while [material].kind != "constant").
lambda = 32.038120320e9   # Pa
mu     = 32.038120320e9   # Pa
rho    = 2670.0           # kg/m^3

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

[mesh]
path  = "bp5/mesh/reference/bp5_tandem_exact_meters.msh"
order = 1

[velocity]
# Depth-profile path takes precedence over the sidecar regardless of this flag.
use_sidecar = false

[stress]
kind        = "constant_tensor"
sigma_xx_pa = 0.0
sigma_yy_pa = 0.0
sigma_zz_pa = 0.0
sigma_xy_pa = 0.0
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[numerics]

[time]
tfinal = 3.15e9
dt_max = 1.0e6

[solver]
type            = "cg_amg"
ksp_rtol        = 1.0e-8
amg_print_level = 0

[output]
output_dir = "."

[boundary]
fault_attr      = 3
natural_attrs   = [1]
dirichlet_attrs = [5]

[friction.rate_state]
f_0_default     = 0.6
V_0_default     = 1.0e-6
eta             = "auto"
a_default       = 0.010
b_default       = 0.015
Dc_default      = 0.004
V_init_default  = 1.0e-9
sigma_n_default = 50.0e6
