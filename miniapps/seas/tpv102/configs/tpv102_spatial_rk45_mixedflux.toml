# =====================================================================
#  SCEC TPV102 — rate-and-state friction (aging law), p1, SCALAR mixed
#  (central) flux + explicit RK45, run through the SAFS spatial
#  dynamic-rupture driver (seas_spatial_dyn_driver).
#
#  This is the RK45 + mixed-flux variant of tpv102_spatial.toml.  The ONLY
#  difference from the ADER config is [numerics].time_integrator = "rk45"
#  (+ this header): at p1 the central (mixed) flux is unstable under
#  ADER-O2 (the predictor is locked to O2 and amplifies the imaginary-axis
#  modes central flux creates); an explicit RK of order >= 3 (RK45) has
#  imaginary-axis coverage and is stable.  See
#  document/mixed_flux_dev/BUILD_mixed_flux_rk_dynamic_rupture_2026-05-28.md.
#
#  Rate-state RK path: the coupled RK-on-(Q, psi, slip) stepper
#  AdvanceRKCoupled_Spatial drives wave.Mult, whose fault face runs the
#  instantaneous FaultFaceFlux::Evaluate (the same RS Riemann solve as the
#  ADER substep).  fault_iterator below is ADER-only and is IGNORED on the
#  RK path (kept for parity with the ADER config).
#
#  Plan: PLAN_tpv_regression_via_spatial_dyn_driver_2026-05-24.md, Phase 8
#        + PLAN_rk45_lsw_mixed_flux_2026-05-29.md, Phase 14 (RS RK path).
#  Physics oracle: drivers/tpv102_driver.cpp + config/tpv102_params.hpp.
#
#  Stress convention (D3.2): kind = "fault_local_prestress" seeds the
#  per-DOF pre-stress directly (tau2_0 = tau_strike, sigma_n0 = sigma_n
#  - P_p), right-lateral / compression POSITIVE — NO Cauchy projection.
#
#  VW-zone a(x,z): native TPV102 uses SCEC Eq.(4) a = a_vs + (a_vw-a_vs)
#  * B_strike * B_dip with a smooth SCEC boxcar B (tanh transition).
#  Reproduced EXACTLY by the [[friction.rate_state.spatial]]
#  kind="boxcar_taper" rule below: ResolveRateState blends per-DOF as
#  a = a_outer + (a_inner-a_outer)*B (Phase 8 taper consumption now wired;
#  the prior hard-box approximation is removed).
#
#  Boundary attributes: this TPV102 mesh uses fault=3, free=1, absorbing=5
#  (Physical Surface 1/3/5; see [boundary] below).
# =====================================================================

[meta]
schema_version = 1
law            = "rate_state"
description    = "SCEC TPV102 (RS aging) via spatial_dyn_driver — p1, scalar Riemann, mixed (adjacent central) flux, explicit RK45."

[problem]
tag = "tpv102"   # selects the SCEC TPV102 on-fault station writer in spatial_dyn_driver

# Material: homogeneous, native TPV102Params (identical to TPV205).
#   mu = 32_038_120_320 Pa, lambda = 32_043_759_360 Pa, rho = 2670.
[material_constant_fallback]
lambda = 32043759360.0
mu     = 32038120320.0
rho    = 2670.0

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

[mesh]
# Smallest available TPV102 mesh (1000 m fault resolution, ~10 MB) — the
# default for a quick parse.  The 8N/400r dev sbatch PINS the 200 m mesh
# (tpv102/mesh/tpv102_200m.msh) via --mesh for a 400-rank-sized run.
path  = "tpv102/mesh/tpv102_1000m.msh"
order = 1

[velocity]
use_sidecar = false

[stress]
kind          = "fault_local_prestress"
tau_strike_pa = 75.0e6     # native TPV102 tau_ini (+ right-lateral)
tau_dip_pa    = 0.0
sigma_n_pa    = 120.0e6

[numerics]
time_integrator = "rk45"     # Phase 14: explicit Dormand-Prince RK45 (NOT ADER).
                             #   Required for stable central/mixed flux at p1.
ader_order     = 2          # ignored on the RK path (kept for ADER parity).
mixed_flux     = "adjacent" # central flux on fault-adjacent faces (scalar path).
cfl            = 0.25       # RK-aware Adjacent factor (0.6) applied internally;
                            #   STARTING calibration — confirm empirical stable
                            #   dt from the first dev-queue smoke (BUILD doc §5.4).
cfl_safety     = "dg"       # apply the DG /(2p+1)*(1/3) safety factor
interior_flux  = "scalar"   # homogeneous Godunov (TPV102 is homogeneous); the
                            #   RK path is scalar-only (matrix/bimaterial rejected).
fault_iterator = "substep"  # ADER-only; IGNORED on the RK path (kept for parity).
use_pml        = false

[time]
tfinal     = "0.2s"
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.05s"

[output]
output_dir     = "output_tpv102_spatial"
restart_prefix = "cp"
paraview_fault = "hdf5"
paraview_fault_dt = "0.01s"

# Rate-and-state, aging law (native TPV102Params).
#   VW core   (velocity-weakening):       a = a_vw = 0.008  (DEFAULT)
#   border    (velocity-strengthening):   a = a_vs = 0.016  (taper rule)
#   b = 0.012, Dc(L) = 0.02 m, f_0 = 0.6, V_0 = 1e-6, V_init = 1e-12.
#
# The VW core a is the default; the velocity-strengthening border + the 3 km
# SCEC tanh transition are applied by the boxcar_taper rule below, which
# blends a_inner (a_vw) -> a_outer (a_vs) via the SCEC boxcar so the per-DOF
# a field reproduces native ComputeA(x,z) EXACTLY.  a_default = a_vw <
# b_default keeps the parser's scalar a<b guard satisfied; the resolver
# allows per-DOF a>b at the border (R-011).
[friction.rate_state]
a_default       = 0.008
b_default       = 0.012
Dc_default      = 0.02
V_0_default     = 1.0e-6
f_0_default     = 0.6
V_init_default  = 1.0e-12
sigma_n_default = 120.0e6
state_evolution = "aging_law"
eta             = "auto"

# Velocity-strengthening border via the native SCEC smooth boxcar taper
# (ComputeA, config/tpv102_params.hpp): a ramps a_vw->a_vs over a 3 km
# C-infinity tanh margin (SCEC Eq. 4-5) around the VW core (|x|<=Ls=15 km AND
# down-dip within +-W/2=7.5 km of the 7.5 km hypocentre).  Replaces the prior
# HARD box (Phase 8 deferral) that over-strengthened the 3 km transition margin
# and arrested the rupture too abruptly at the fault edges.  Aging law has no
# V_w channel.  a = a_outer + (a_inner-a_outer)*B.
[[friction.rate_state.spatial]]
kind              = "boxcar_taper"
a_inner           = 0.008     # a_vw (VW core)
a_outer           = 0.016     # a_vs (VS border)
boxcar_center_x_m = 0.0
boxcar_half_x_m   = 15000.0   # Ls (along-strike half-width)
boxcar_trans_x_m  = 3000.0    # ws (along-strike transition)
boxcar_center_z_m = -7500.0   # hypocentre depth (z<0 below surface)
boxcar_half_z_m   = 7500.0    # W/2 (down-dip half-width)
boxcar_trans_z_m  = 3000.0    # w  (down-dip transition)

# Nucleation: SCEC compact-bell gradual overstress (TPV102), strike-only.
#   F(r) = exp(r^2/(r^2 - R^2)) * smoothStep(t, T_nuc), R = 3 km.
#   delta_tau0 = 25 MPa, T_nuc = 1 s; centre at the hypocenter (z=-7500).
[nucleation]
kind = "gradual_overstress_compact_circular"

[nucleation.gradual_overstress_compact_circular]
center_x_m   = 0.0
center_y_m   = 0.0
center_z_m   = -7500.0
radius_m     = 3000.0
delta_tau_pa = 25.0e6
T_nuc_s      = "1.0s"

[boundary]
fault_attr      = 3
natural_attrs   = [1]
absorbing_attrs = [5]

[fault_geometry]
ref_normal = [0.0, -1.0, 0.0]
up         = [0.0,  0.0, 1.0]
kind       = "vertical_strike_slip"

[hypocenter]
x_m                 = 0.0
y_m                 = 0.0
z_m                 = -7500.0
nucleation_radius_m = 3000.0
