[pytest]
# Phase 4 of PLAN_cgal_corefine.md (P-013).
# Legacy Python conformalizer tests are gated behind `-m legacy`.
# Default invocation (`pytest`) runs only the non-legacy suite.
markers =
    legacy: tests of the legacy Python conformalizer (fault_intersect.py / conformalize_faults.py); see README.md
addopts = -m "not legacy"
