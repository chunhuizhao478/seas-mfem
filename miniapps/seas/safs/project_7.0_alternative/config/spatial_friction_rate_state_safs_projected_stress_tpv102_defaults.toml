# =========================================================================
# SAFS + RATE-AND-STATE (aging law) with DEFAULT TPV102 FRICTION PARAMETERS.
# =========================================================================
# Companion to PLAN_tpv_regression_via_spatial_dyn_driver_2026-05-24 (Phase 3).
#
# This is the "rate-and-state + SAFS run" deliverable: the SAFS geometry / mesh
# / regional stress / Gaussian nucleation, with rate-and-state friction whose
# parameters are the SCEC TPV102 DEFAULTS (config/tpv102_params.hpp), to be
# tuned later by the user.  It differs from the Dc2 smoke sibling
#   spatial_friction_rate_state_safs_projected_stress_resolution_Dc2.toml
# only in the [friction.rate_state] block (TPV102 defaults instead of the
# Dc=2.0 m smoke values) and the run window (see [time]).
#
# Default TPV102 friction (config/tpv102_params.hpp):
#   f0 = 0.6, V0 = 1e-6, b = 0.012, Dc = 0.02 m, a = a_vw = 0.008
#   (velocity-weakening), V_ini = 1e-12 m/s.
# Uniform a = a_vw makes the whole fault velocity-weakening (a < b); TPV102's
# benchmark-specific VW-core / VS-border spatial a(x) (Boxcar Eq. 4) does NOT
# map onto the SAFS fault geometry and is left as a later [[friction.rate_state.
# spatial]] tuning step (per-DOF a / Dc are allowed; b / f_0 / V_0 are rejected).
#
# Nucleation feasibility (R-021): L_nuc = mu*Dc/((b-a)*sigma_n)
#   ~= 32e9 * 0.02 / (0.004 * ~49e6) ~= 3.3 km < the 4 km patch radius, so the
# patch is (barely) SUPER-critical with these defaults — unlike the Dc=2.0 m
# smoke (L_nuc ~ 130-420 km, sub-critical).  Whether a self-sustaining rupture
# nucleates also depends on the prestress vs steady-state strength; tune Dc /
# patch / prestress as needed (the --print-derived RS gate reports L_nuc, f_ss,
# and the overstress drive).
#
# Run (from miniapps/seas; np=8 example):
#   mpirun -np 8 ./seas_spatial_dyn_driver \
#       --config safs/project_7.0_alternative/config/spatial_friction_rate_state_safs_projected_stress_tpv102_defaults.toml \
#       --paraview --paraview-fault-hdf5 --paraview-fault-zfp-tol 1e-12 \
#       --print-derived
#
# Schema reference:
#   safs/project_7.0_alternative/document/spatial_friction_config_schema.md

[meta]
schema_version = 1
law            = "rate_state"
description    = "SAFS rate-and-state (aging) with DEFAULT TPV102 friction params: a=0.008<b=0.012 (velocity-weakening), Dc=0.02 m, V_0=1e-6, V_init=1e-12, on the 500 m z0embed mesh, gradual_overstress nucleation. Friction params are TPV102 defaults to be tuned by the user."

[material_constant_fallback]
# Equal lambda = mu => Poisson ratio = 0.25 (typical crust).  SAFS material
# (consumed when [velocity].use_sidecar = false).  cp = sqrt((lam+2mu)/rho)
# ~= 5996 m/s, nearly identical to TPV102's cp = 6000 m/s.
lambda = 32.0e9   # Pa
mu     = 32.0e9   # Pa
rho    = 2670.0   # kg/m^3

[pore_pressure]
# Authoritative source of P_p for the SEAS effective-stress identity
#   sigma_n_eff = sigma_n_total - P_p
# NOTE: the rate-state path passes a ZERO PorePressureSpec to ResolveRateState
# (geom.sigma_n_per_dof() is already effective); this P_p is still consumed by
# the regional stress projection.
P_p_pa            = 16.0e6    # 16 MPa
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 1.0e6     # 1 MPa floor

[mesh]
# 500 m near-fault z0embed mesh (same as the LSW / Dc2 RS siblings).
path  = "safs/project_7.0_alternative/meshing/results/msh/safs_fault_box_nwcut_500m_lcfar3000_z0embed.msh"
order = 1

[velocity]
# use_sidecar = false => use [material_constant_fallback].
use_sidecar = false

[stress]
# Regional H&Z tensor projected per-DOF (compression POSITIVE, EAST-NORTH-UP).
# D3.1: sigma_xy_pa is RIGHT-LATERAL-POSITIVE (the source factory negates it
# at construction); normals stay compression-positive.  Same values as the LSW
# / Dc2 RS configs (post-D3.1 flip).
kind        = "constant_tensor"
sigma_xx_pa = 5.056619147855508e+07
sigma_yy_pa = 1.1143380852144492e+08
sigma_zz_pa = 4.50e+07
sigma_xy_pa = +9.888543819998317e+06   # D3.1: right-lateral-POSITIVE (negated at the source factory)
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[numerics]
# Do NOT set interior_flux: the driver defaults to the scalar (homogeneous)
# WaveOperator ctor; the matrix Riemann option is Phase 9.
ader_order = 2
mixed_flux = "adjacent"
cfl        = 0.5
# R-025: use_pml is NOT wired into seas_spatial_dyn_driver (it never calls
# WaveOperator::SetPML); setting it true would only silence the reflection
# warning WITHOUT absorbing anything.  The box exterior uses first-order
# ABSORBING BCs (.geo attrs 103/104).  Keep tfinal within the reflection-free
# window (see [time]); leave use_pml=false until a real PML layer is wired.
use_pml    = false

[time]
# R-025: <= the ~6.94 s reflection-free window (min_box_dim/cp_max) for this
# 500 m mesh + cp=5996 m/s.  Beyond it, reflections off the box contaminate the
# rupture, so every saved snapshot past ~7 s would be unphysical with no PML.
tfinal     = "6s"
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.1s"

[output]
output_dir              = "output_safs_dyn_ratestate_tpv102def_500m_6s"
restart_prefix          = "cp"
paraview_volume         = "hdf5"
paraview_bulk           = "hdf5"
paraview_fault          = "hdf5"
paraview_volume_dt      = "0.1s"      # ~60 snapshots over 6 s
paraview_bulk_dt        = "0.1s"      # ~60 snapshots over 6 s
paraview_fault_dt       = "0.02s"     # ~300 snapshots over 6 s
paraview_volume_zfp_tol = 1.0e-3
paraview_bulk_zfp_tol   = 1.0e-3
paraview_fault_zfp_tol  = 1.0e-12
max_snapshots           = 5000
checkpoint_every_steps  = 10000

[nucleation]
# Time-domain nucleation: smoothStep-ramped Gaussian δτ.  Law-agnostic — the
# per-sub-step accumulator writes tau{1,2}_nuc and flows through the aging
# iterator unchanged.  Same hypocenter / patch / amplitude as the SAFS siblings.
kind = "gradual_overstress"

[nucleation.gradual_overstress]
center_x_m          =  606971.0
center_y_m          = 3707270.0
center_z_m          =   -4965.62
radius_dip_m        =     4000.0
radius_strike_m     =     4000.0
delta_tau_dip_pa    =        0.0
delta_tau_strike_pa =     30.0e6   # 20->30 MPa: stronger nucleation (patch shear strength ~46 MPa; 20 MPa nucleated only weakly, job 7751862)
T_nuc_s             =        1.0

[friction]
# sigma_n strength floor [Pa] (sliver-blowup plan 2026-05-26).  Below this
# compression the shear strength saturates at a cohesion-like constant
# (f_V * floor) instead of using |sigma_n| under a tensile excursion.
# Applies to both laws.  Omit / set < 0 to disable (byte-exact with the
# historical RS |sigma_n|).
sigma_n_strength_floor_pa = 10.0e6

[friction.rate_state]
# DEFAULT TPV102 friction parameters (config/tpv102_params.hpp), to be tuned by
# the user.  R-009: V_0_default MUST equal FrictionSolver::V0 (= 1e-6) or the
# equilibrium-psi seed guard aborts.  Per-DOF a / Dc / V_init / sigma_n / eta
# spatial rules are allowed; per-DOF b / f_0 / V_0 are rejected (AgingLawPsi is
# scalar).
a_default       = 0.008      # TPV102 a_vw (velocity-weakening; a < b)
b_default       = 0.012      # TPV102 b
Dc_default      = 0.1        # m (raised 0.02->0.1 for L_b process-zone resolution; no longer TPV102 L)
V_0_default     = 1.0e-6     # TPV102 V0; MUST equal FrictionSolver::V0 (R-009)
f_0_default     = 0.6        # TPV102 f0
V_init_default  = 1.0e-12    # TPV102 V_ini (quasi-static)
sigma_n_default = 120.0e6    # TPV102 sigma_n (fallback only; driver uses geom.sigma_n_per_dof())
eta             = "auto"     # 0.5*sqrt(mu*rho) per DOF
