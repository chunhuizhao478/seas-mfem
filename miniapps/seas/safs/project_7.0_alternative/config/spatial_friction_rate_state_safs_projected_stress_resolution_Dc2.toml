# =========================================================================
# SAFS + RATE-AND-STATE (aging law) RESOLUTION-TEST VARIANT — NOT production.
# =========================================================================
# Phase 3 of PLAN_tpv_regression_via_spatial_dyn_driver_2026-05-24.
#
# Rate-and-state sibling of
#   spatial_friction_slip_weakening_safs_projected_stress_resolution_Dc2.toml
# Identical mesh / regional stress / nucleation; the ONLY change is the
# friction law: [meta].law = "rate_state" with a [friction.rate_state]
# aging-law block in place of [friction.slip_weakening].
#
# Drives the SAFS Dc2 problem with aging rate-and-state friction.  The
# first smoke is fully VELOCITY-WEAKENING (a < b everywhere) per R-011.
#
# SMOKE-PARAMETER CAVEAT: a_default/b_default and V_0_default are fixed by
# the plan (R-011: a=0.010 < b=0.015; R-009: V_0 = 1e-6 == FrictionSolver::V0).
# Dc_default / V_init_default / sigma_n_default are crustal-RS smoke values
# mirroring the LSW Dc2 resolution rationale (Dc carried over at 2.0 m);
# they exercise the RS code path (equilibrium-psi seed, aging iterator,
# Brent solve) and are the physics-tuning knobs for the 8-rank cluster run
# — the "physical RS rupture" acceptance is a cluster deliverable, not a
# local --dry-run check.
#
# Run (from miniapps/seas):
#   mpirun -np 8 ./seas_spatial_dyn_driver \
#       --config safs/project_7.0_alternative/config/spatial_friction_rate_state_safs_projected_stress_resolution_Dc2.toml \
#       --paraview --paraview-fault-hdf5 --paraview-fault-zfp-tol 1e-12 \
#       --print-derived
#
# Schema reference:
#   safs/project_7.0_alternative/document/spatial_friction_config_schema.md

[meta]
schema_version = 1
law            = "rate_state"
description    = "SAFS-ALT6 rate-and-state (aging) RESOLUTION-TEST variant: a=0.010 < b=0.015 (velocity-weakening), V_0=1e-6, Dc=2.0 m on the 500 m z0embed mesh, gradual_overstress nucleation. NOT production (smoke parameters)."

[material_constant_fallback]
# Equal lambda = mu => Poisson ratio = 0.25 (typical crust).
# Consumed when [velocity].use_sidecar = false (below).
lambda = 32.0e9   # Pa
mu     = 32.0e9   # Pa
rho    = 2670.0   # kg/m^3

[pore_pressure]
# Authoritative source of P_p for the SEAS effective-stress identity
#   sigma_n_eff = sigma_n_total - P_p
# Matches the H&Z summary JSON.  NOTE: the rate-state path passes a ZERO
# PorePressureSpec to ResolveRateState (geom.sigma_n_per_dof() is already
# effective); this P_p is still consumed by the regional stress projection.
P_p_pa            = 16.0e6    # 16 MPa
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 1.0e6     # 1 MPa floor

[mesh]
# 500 m near-fault z0embed mesh (same as the LSW Dc2 sibling).
path  = "safs/project_7.0_alternative/meshing/results/msh/safs_fault_box_nwcut_500m_lcfar3000_z0embed.msh"
order = 1

[velocity]
# use_sidecar = false => use [material_constant_fallback].
use_sidecar = false

[stress]
# Regional H&Z tensor projected per-DOF (compression POSITIVE, EAST-NORTH-UP).
# D3.1: sigma_xy_pa is RIGHT-LATERAL-POSITIVE (the source factory negates it
# at construction); normals stay compression-positive, sigma_yz is the dip
# shear.  Same values as the LSW Dc2 config (post-D3.1 flip).
kind        = "constant_tensor"
sigma_xx_pa = 5.056619147855508e+07
sigma_yy_pa = 1.1143380852144492e+08
sigma_zz_pa = 4.50e+07
sigma_xy_pa = +9.888543819998317e+06   # D3.1: right-lateral-POSITIVE (negated at the source factory)
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[numerics]
# Do NOT set interior_flux: the driver defaults to the scalar (homogeneous)
# WaveOperator ctor; the matrix Riemann option is Phase 9.
ader_order = 2
mixed_flux = "adjacent"
cfl        = 0.5
# R-025: use_pml is NOT wired into seas_spatial_dyn_driver (it never calls
# WaveOperator::SetPML); setting it true would only silence the reflection
# warning WITHOUT absorbing anything.  The box exterior uses first-order
# ABSORBING BCs (.geo attrs 103/104), so reflections are partially (not
# perfectly) damped.  To keep every saved snapshot physical, tfinal is bounded
# by the box reflection time min_box_dim/cp_max (~6.94 s for this 500 m mesh +
# cp=5996 m/s).  Leave use_pml=false until a real PML layer is wired.
use_pml    = false

[time]
# R-025: <= the ~6.94 s reflection-free window (min_box_dim/cp) for this mesh.
# Beyond it, reflections off the box contaminate the rupture.  (Was 100 s with
# use_pml=false, which the driver warned about; PML is not wired — see [numerics].)
tfinal     = "6s"
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.1s"

[output]
output_dir              = "output_safs_dyn_ratestate_500m_hz1671_psi37_az351_100s"
restart_prefix          = "cp"
paraview_volume         = "hdf5"
paraview_bulk           = "hdf5"
paraview_fault          = "hdf5"
paraview_volume_dt      = "1.0s"      # 100 snapshots
paraview_bulk_dt        = "1.0s"      # 100 snapshots
paraview_fault_dt       = "0.05s"     # 2000 snapshots
paraview_volume_zfp_tol = 1.0e-3
paraview_bulk_zfp_tol   = 1.0e-3
paraview_fault_zfp_tol  = 1.0e-12
max_snapshots           = 5000
checkpoint_every_steps  = 10000

[nucleation]
# Time-domain nucleation: smoothStep-ramped Gaussian δτ.  Law-agnostic —
# the per-sub-step accumulator writes tau{1,2}_nuc and flows through the
# aging iterator unchanged.
kind = "gradual_overstress"

[nucleation.gradual_overstress]
# Same hypocenter / patch / amplitude as the LSW Dc2 sibling.  The δτ = 20
# MPa overstress drives the patch to slip; the aging-law friction then
# governs the dynamic weakening.
center_x_m          =  606971.0
center_y_m          = 3707270.0
center_z_m          =   -4965.62
radius_dip_m        =     4000.0
radius_strike_m     =     4000.0
delta_tau_dip_pa    =        0.0
delta_tau_strike_pa =     30.0e6   # 20->30 MPa: stronger nucleation (patch shear strength ~46 MPa; 20 MPa nucleated only weakly, job 7751862)
T_nuc_s             =        1.0

[friction]
# sigma_n strength floor [Pa] (sliver-blowup plan 2026-05-26).  Below this
# compression the shear strength saturates at a cohesion-like constant
# (f_V * floor) instead of using |sigma_n| under a tensile excursion.
# Applies to both laws.  Omit / set < 0 to disable (byte-exact with the
# historical RS |sigma_n|).
sigma_n_strength_floor_pa = 10.0e6

[friction.rate_state]
# Aging rate-and-state friction (the only RS law wired in Phases 1-3).
# DEPTH-VARYING a(z)/b(z) via the [friction.rate_state.depth_profile] block
# below (VW->VS transition ~11 km).  a_default / b_default are the scalar
# FALLBACK, UNUSED for a/b while the profile is enabled (and the a<b default
# check is skipped).
# R-009: V_0_default MUST equal FrictionSolver::V0 (= 1e-6) or the
# equilibrium-psi seed guard aborts.
# Per-DOF a / Dc / V_init / sigma_n / eta spatial rules are allowed; per-DOF
# b / f_0 / V_0 are rejected by ResolveRateState (AgingLawPsi is scalar).
a_default       = 0.010      # unused (depth profile active); fallback only
b_default       = 0.015      # unused (depth profile active); fallback only
Dc_default      = 0.1        # m (was 2.0; set to 0.1 for L_b process-zone resolution — NB the "Dc2" in the filename is now stale)
V_0_default     = 1.0e-6     # MUST equal FrictionSolver::V0 (R-009)
f_0_default     = 0.6
V_init_default  = 1.0e-9     # quasi-static initial slip rate
sigma_n_default = 50.0e6     # fallback only; driver uses geom.sigma_n_per_dof()
eta             = "auto"     # 0.5*sqrt(mu*rho) per DOF

[friction.rate_state.depth_profile]
# Two-CSV depth profile (Phase 11b).  Each row is `value, depth_km` (value
# FIRST).  b(z) = a(z) - (a-b)(z), each interpolated on its own grid and
# flat-clamped outside.  depth_units = "km" => CSV depth * 1000 -> metres.
# These *_vwvs11km.csv profiles put the VW->VS transition (a-b = 0) at ~11 km.
param_a_csv         = "safs/project_7.0_alternative/friction/rate-and-state/param_a_vwvs11km.csv"
param_a_minus_b_csv = "safs/project_7.0_alternative/friction/rate-and-state/param_a_minus_b_vwvs11km.csv"
depth_units         = "km"
