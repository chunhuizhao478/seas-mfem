# EXAMPLE: spatial-friction config for the SAFS dynamic-rupture driver,
# rate-and-state Aging-law variant.  This is provided for completeness;
# rate-and-state is the secondary friction law for this driver (LSW is
# the production default per the user objective).
#
# Schema reference:
#   safs/project_7.0_alternative/document/spatial_friction_config_schema.md

[meta]
schema_version = 1
law            = "rate_state"
description    = "SAFS-ALT6 rate-and-state Aging law, BP5-style scalars"

[material_constant_fallback]
lambda = 32.0e9
mu     = 32.0e9
rho    = 2670.0

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

[mesh]
path  = "safs/project_7.0_alternative/meshing/results/msh/safs_fault_box_nwcut_1000m_lcfar3000.msh"
order = 1

[velocity]
model         = "cvmh"
dataset_root  = "safs/project_7.0_alternative"
override_path = ""

[stress]
kind = "constant_tensor"
sigma_xx_pa = 80.0e6
sigma_yy_pa = 80.0e6
sigma_zz_pa = 80.0e6
sigma_xy_pa = 20.0e6
sigma_yz_pa =  0.0
sigma_xz_pa =  0.0

[numerics]
ader_order = 2
mixed_flux = "none"
cfl        = 0.5
use_pml    = false

[time]
tfinal     = "30s"
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.1s"

[output]
output_dir              = "output_safs_dyn_rs_1000m"
restart_prefix          = "cp"
paraview_volume         = "hdf5"
paraview_bulk           = "hdf5"
paraview_fault          = "hdf5"
paraview_volume_dt      = "0.05s"
paraview_bulk_dt        = "0.05s"
paraview_fault_dt       = "0.001s"
paraview_volume_zfp_tol = 1.0e-3
paraview_bulk_zfp_tol   = 1.0e-3
paraview_fault_zfp_tol  = 1.0e-12
max_snapshots           = 5000
checkpoint_every_steps  = 10000

# Rate-and-state nucleation is achieved via the V_init field, not via
# [nucleation] (the [nucleation] block is for LSW forced rupture only
# and is ignored when [meta].law = "rate_state").  The [nucleation]
# block below is therefore omitted on purpose.

[friction.rate_state]
f_0_default     = 0.6
V_0_default     = 1.0e-6
eta             = "auto"        # per-DOF eta = 0.5 * sqrt(mu * rho)
a_default       = 0.010
b_default       = 0.015
Dc_default      = 0.004
V_init_default  = 1.0e-9
sigma_n_default = 50.0e6

# Velocity-weakening core box (a < b inside)
[[friction.rate_state.spatial]]
kind    = "box"
x_min_m = 478000.0
x_max_m = 486000.0
y_min_m = 3748000.0
y_max_m = 3756000.0
z_min_m = -15000.0
z_max_m = -5000.0
a       = 0.005
b       = 0.015
