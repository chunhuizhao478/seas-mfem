# EXAMPLE: minimal-viable constant-tensor [stress] block (D-1).  This
# file is parsed by the Phase-1 unit test and is the canonical
# illustration of the constant-tensor stress source.
#
# The full TOML config the driver consumes must include all the OTHER
# mandatory blocks ([meta], [material_constant_fallback], ...).  See
# EXAMPLE_spatial_friction_slip_weakening_safs.toml for a complete file
# that uses kind = "constant_tensor".  This file omits the other blocks
# for clarity; in tests we splice it into a full config before parsing.

[meta]
schema_version = 1
law            = "slip_weakening"
description    = "EXAMPLE constant-tensor stress source (D-1)"

[material_constant_fallback]
lambda = 32.0e9
mu     = 32.0e9
rho    = 2670.0

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

[mesh]
path  = "safs/project_7.0_alternative/meshing/results/msh/safs_fault_box_nwcut_1000m_lcfar3000.msh"
order = 1

[velocity]
model         = "cvmh"
dataset_root  = "safs/project_7.0_alternative"
override_path = ""

[stress]
# D-1: constant background Cauchy tensor.  EAST-NORTH-UP frame,
# compression POSITIVE (SEAS convention; matches stress/code/
# hickman_and_zoback_*).  Representative SAFOD-style values:
#   SHmax ~ 100 MPa rotated 45 deg from N (i.e. NE-ward)
#   Shmin ~  60 MPa
#   Sv    ~  80 MPa
# In the cartesian (xx, yy, zz, xy, yz, xz) decomposition:
kind        = "constant_tensor"
sigma_xx_pa = 80.0e6
sigma_yy_pa = 80.0e6
sigma_zz_pa = 80.0e6
sigma_xy_pa = 20.0e6
sigma_yz_pa =  0.0
sigma_xz_pa =  0.0

[numerics]
ader_order = 2
mixed_flux = "none"
cfl        = 0.5
use_pml    = false

[time]
tfinal     = "0.5s"
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.1s"

[output]
output_dir              = "output_safs_dyn_const_tensor"
restart_prefix          = "cp"
paraview_volume         = "hdf5"
paraview_bulk           = "hdf5"
paraview_fault          = "hdf5"
paraview_volume_dt      = "0.05s"
paraview_bulk_dt        = "0.05s"
paraview_fault_dt       = "0.001s"
paraview_volume_zfp_tol = 1.0e-3
paraview_bulk_zfp_tol   = 1.0e-3
paraview_fault_zfp_tol  = 1.0e-12
max_snapshots           = 5000
checkpoint_every_steps  = 10000

[friction.slip_weakening]
mu_s_default     = 1.1
mu_d_default     = 0.5
d_c_default      = 0.5
cohesion_default = 0.0
