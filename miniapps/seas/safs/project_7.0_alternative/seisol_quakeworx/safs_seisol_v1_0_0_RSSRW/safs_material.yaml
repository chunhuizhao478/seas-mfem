!Switch
# Constant elastic medium (MFEM [material_constant_fallback], use_sidecar=false).
# lambda = mu => Poisson ratio 0.25; Vp ~= 5.39 km/s, Vs ~= 3.46 km/s.
# No off-fault plasticity in our problem (Plasticity=0), so plastCo/bulkFriction and
# the initial-stress !Include that tpv13's material.yaml carries are intentionally absent.
[rho, mu, lambda]: !ConstantMap
  map:
    rho:    2670.0
    mu:     3.2e10
    lambda: 3.2e10
