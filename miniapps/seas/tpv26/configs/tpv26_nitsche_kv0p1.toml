# =====================================================================
#  SCEC TPV26 — linear slip weakening with forced-rupture nucleation,
#  depth-dependent initial stress and hydrostatic fluid pressure, linear
#  elastic bulk, run through the Nitsche dynamic-rupture driver
#  (seas_nitsche_dyn_driver; rheology plan rev 1, phase R1).
#
#  Built from tpv205/configs/tpv205_nitsche.toml (the damped kv0p1 deck)
#  with the values of tpv26/benchmark_document/TPV26_27_Description_v13.pdf:
#
#   - Frame: X along strike (SCEC x), Y fault normal (SCEC z; the far side
#     is Y > 0), Z up (SCEC -y); fault X in [-20, 20] km, Z in [-20, 0] km
#     on Y = 0, reaching the free surface; hypocenter (-5, 0, -10) km.
#   - Material: rho 2670 kg/m^3, cs 3464 m/s, cp 6000 m/s.
#   - [initial_stress] lithostatic_ratio: the description's sigma_11,
#     sigma_22, sigma_33, sigma_13 and the hydrostatic fluid pressure as one
#     effective stress field, written in the code frame (b_xx = b11, b_yy =
#     b33, b_xy = b13).  It is the fault prestress and, from phase R3, the
#     bulk's initial stress; [stress] stays all zero (the driver refuses
#     anything else alongside [initial_stress]).
#   - Friction (Part 4): mu_s 0.18, mu_d 0.12, d0 0.30 m, cohesion 0.4 MPa
#     + 0.00072 MPa/m (5000 m - depth) above 5 km; the slip D is the slip
#     path (slip_measure = "path"); tension counts as zero normal stress
#     (tension = "zero_strength"); the Nitsche penalty keeps the fault closed.
#   - Nucleation (Part 5): forced rupture, r_crit 4 km, Vs 3464 m/s,
#     t0 0.5 s; no [nucleation] table.
#   - [rheology]: the TPV27 table with enabled = false; TPV27 is this deck
#     with enabled = true (refused until phase R3).
#   - Stations: tpv26/stations/tpv26_fault_stations.csv (12 points, Part 8)
#     and tpv26_off_fault_stations.csv (6 surface points, Part 9).
#
#  Regularization: Kelvin-Voigt (eta_bar 0.1) and Prakash-Clifton
#  (v* = 1 m/s, L = 0.01 m) as in the TPV205/TPV104 golds.
#
#  Mesh: mirror-symmetric across the fault, generated, not committed (from
#  miniapps/seas, gmsh on PATH):
#    bash tpv26/mesh/make_tpv2627_meshes.sh 1000 200
#  The 1000 m mesh does not resolve the cohesive zone: smoke runs only.
#  Production uses --mesh with the 200 m (or 100 m) mesh and --order 2.
#
#  Scope: Chunhui Zhao, 2026-10-20.
# =====================================================================

[meta]
schema_version = 1
law            = "slip_weakening"
description    = "SCEC TPV26 (forced rupture, depth-dependent stress, fluid pressure, elastic) via the Nitsche dynamic-rupture driver."

[problem]
tag = "tpv26"   # output file prefix; the stations come from [output.stations]

# Material: homogeneous, rho = 2670, cs = 3464, cp = 6000:
#   mu = rho cs^2, lambda = rho (cp^2 - 2 cs^2).
[material_constant_fallback]
lambda = 32043759360.0
mu     = 32038120320.0
rho    = 2670.0

# The fluid pressure enters only through [initial_stress] (effective stress);
# P_p must stay 0 here.
[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0     # sigma_min of the range check (skipped with tension = "zero_strength")

[mesh]
# 1000 m smoke mesh; production overrides with --mesh (200 m, 100 m).
path  = "tpv26/mesh/tpv2627_mirror_1000m.msh"
order = 1

[velocity]
use_sidecar = false

# The SAFS parser requires [stress]; with [initial_stress] every component is 0.
[stress]
kind        = "constant_tensor"
sigma_xx_pa = 0.0
sigma_yy_pa = 0.0
sigma_zz_pa = 0.0
sigma_xy_pa = 0.0
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

# Effective initial stress (description Part 3), tension positive, in the
# code frame: depth d = -Z, sigma_v = -rho g d, P_f = rho_f g d, taper Omega
# from 15 to 20 km.
[initial_stress]
kind                 = "lithostatic_ratio"
rho_rock_kg_m3       = 2670.0
rho_fluid_kg_m3      = 1000.0
gravity_m_s2         = 9.8
surface_elevation_m  = 0.0
b_xx                 = 0.926793    # b11 (along strike)
b_yy                 = 1.073206    # b33 (fault normal)
b_zz                 = 0.0
b_xy                 = -0.169029   # b13
b_yz                 = 0.0
b_xz                 = 0.0
taper_top_depth_m    = 15000.0
taper_bottom_depth_m = 20000.0

# TPV27's Drucker-Prager values; enabled = false is TPV26 (linear elastic).
[rheology]
representation = "nodal_pm1"
[rheology.drucker_prager]
enabled           = false
cohesion_pa       = 1.36e6
bulk_friction     = 0.1934
relaxation_time_s = 0.03
[rheology.viscoelastic]
enabled = false
[rheology.damage_breakage]
enabled = false

[numerics]
cfl            = 0.5        # fraction of C(p) (P3)
penalty_factor = 1.0        # IP penalty scale (Nitsche driver only)
# Kelvin-Voigt damping (Day et al. 2005 A8): beta_e = kv_eta (1/3) (h_e/p) / c_s,e, h_e = 6V/A
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

[time]
tfinal     = "13s"
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.05s"

[output]
output_dir     = "output_tpv26_nitsche"
restart_prefix = "cp"
# Fault ParaView output: ONE <output_dir>/fault.vtkhdf per run.
paraview_enabled       = true
paraview_fault         = "hdf5"
paraview_fault_dt      = "0.02s"
paraview_fault_zfp_tol = 0.0
paraview_fault_deflate_level = 1
paraview_free_surface  = "off"   # the Nitsche driver writes no free-surface slice

# On-fault stations (Part 8), snapped to the nearest fault node in 3-D; the
# run aborts if that node is farther than snap_tolerance_m (700 m covers the
# 1000 m mesh at p = 1; <prefix>_station_snap.txt lists the distances).
[output.stations]
file             = "tpv26/stations/tpv26_fault_stations.csv"
snap_tolerance_m = 700.0

# Off-fault surface stations (Part 9): displacement and velocity, h along
# strike, v down, n toward the far side (+Y).
[output.off_fault_stations]
file = "tpv26/stations/tpv26_off_fault_stations.csv"

# Linear slip weakening (Part 4): mu = mu_s + (mu_d - mu_s) max(f1, f2),
# f1 = min(D/d0, 1) with D the slip path, f2 the forced-rupture ramp.
[friction.slip_weakening]
mu_s_default     = 0.18
mu_d_default     = 0.12
d_c_default      = 0.30
cohesion_default = 0.4e6
slip_measure     = "path"
tension          = "zero_strength"

# Cohesion C0 = 0.4 MPa + 0.00072 MPa/m (5000 m - depth) above 5 km (the
# resolver's depth = max(0, -Z)); 0.4 MPa below (cohesion_default).
[[friction.slip_weakening.spatial]]
kind                   = "depth"
z_min_m                = -5000.0
z_max_m                = 0.0
cohesion_taper_axis    = "z"
cohesion_ref_depth_m   = 5000.0
cohesion_grad_pa_per_m = 720.0
cohesion_floor_pa      = 0.4e6

# Forced rupture (Part 5): T(r) = r/(0.7 Vs) + 0.081 r_c/(0.7 Vs) (1/(1 - (r/r_c)^2) - 1)
# for r < r_c, else 1.0e9; r = distance to the hypocenter.
[friction.forced_rupture]
hypocenter_x_m = -5000.0
hypocenter_y_m = 0.0
hypocenter_z_m = -10000.0
r_crit_m       = 4000.0
vs_m_s         = 3464.0
t0_s           = 0.5

[boundary]
fault_attr      = 103
natural_attrs   = [101]
absorbing_attrs = [105]

[fault_geometry]
ref_normal        = [0.0, -1.0, 0.0]
up                = [0.0,  0.0, 1.0]
kind              = "vertical_strike_slip"
orientation       = "propagated"
pin_by            = "reference"
tangent           = "pointwise"
junction_policy   = "refuse"
pin_min_margin    = 0.1

[hypocenter]
x_m                 = -5000.0
y_m                 = 0.0
z_m                 = -10000.0
nucleation_radius_m = 4000.0

[diagnostics]
energy_balance = false

# Prakash-Clifton regularization of the normal stress the law sees
# (SeisSol TPV6/7 values, as the TPV205/TPV104 golds).
[friction.prakash_clifton]
v_star = 1.0      # m/s
length = 0.01     # m
