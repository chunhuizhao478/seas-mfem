# Added for G3 (Chunhui Zhao, 2026-10-27): SCEC BP3 off-fault (free-surface) stations.
# Tandem coordinates for this mesh are km, x1 along the surface, x2 = 0 on the free surface;
# the fault (tag 3) leaves the surface at (0, 0) and dips toward +x1, so x1 > 0 is the
# hanging wall (bp3.lua: dist = x + y / tan(dip) > 1 is the hanging-wall side).
# fn-00 / fn+00: 1 m to either side of the trace.
