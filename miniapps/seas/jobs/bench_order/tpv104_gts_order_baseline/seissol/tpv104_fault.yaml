!Switch
# =====================================================================
# SCEC TPV104 fault model — rate-and-state friction, slip law with
# STRONG VELOCITY WEAKENING (SeisSol FL=103).
# Physics is copied verbatim from the SeisSol Examples tpv104/fault.yaml
# (https://github.com/SeisSol/Examples/tree/master/tpv104); only this
# header comment is added.
#
# Frame (SeisSol / MFEM-mesh convention): x = along-strike, y = fault-normal,
# z = up (free surface z=0, depth z<0). Vertical strike-slip fault at y=0.
# Compression NEGATIVE; right-lateral shear POSITIVE.
#
# Initial effective stress (homogeneous):  s_yy = -120 MPa (normal),
#   s_xy = +40 MPa (right-lateral shear).  All other components 0.
# Rate-state constants in parameters.par:  RS_f0=0.6, RS_sr0=1e-6,
#   RS_b=0.014, RS_muW(f_w)=0.2, RS_iniSlipRate1=1e-16.  rs_sl0(Dc)=0.4 m.
# Spatial fields below (evaluated GP-wise; parameters.par sets GPwise=1):
#   rs_a   : 0.01 in the velocity-weakening (VW) core, ramping to 0.02 in
#            the velocity-strengthening (VS) border via the SCEC smooth
#            boxcar B(x,z) (tanh, Eq. 4-5).  a_in=0.01, a_out=0.02.
#   rs_srW : V_w = 0.1 m/s in the VW core, ramping to 1.0 m/s in the border.
#   VW core:  |x| <= 15 km AND |z+7.5km| <= 7.5 km, with a 3 km tanh margin
#            (so the field is defined out to |x|=18 km, |z+7.5|=10.5 km).
# Nucleation (forced):  Gaussian compact-bell overstress nuc_xy up to 45 MPa
#   within r <= 3 km of the hypocentre (0, 0, -7.5 km), ramped in time by
#   SeisSol's smoothStep over [0, t_0=1 s] (parameters.par t_0).
# =====================================================================
[s_xx,s_yy,s_zz,s_xy,s_yz,s_xz,nuc_xx,nuc_yy,nuc_zz,nuc_yz,nuc_xz]: !ConstantMap
  map:
    s_xx: 0
    s_yy: -120e6
    s_zz: 0
    s_xy: 40e6
    s_yz: 0
    s_xz: 0
    nuc_xx: 0
    nuc_yy: 0
    nuc_zz: 0
    nuc_yz: 0
    nuc_xz: 0
[rs_a, rs_srW, nuc_xy]: !LuaMap
  returns: [rs_a, rs_srW, nuc_xy]
  function: |
      function f (x)
        x1 = math.abs(x["x"])
        box_x = 0.5*(1.0+math.tanh(3000.0/(x1-18000.0) + 3000.0 / (x1-15000.0)))
        if (x1 >= 18000.0) then
          box_x = 0.0
        end
        if (x1 <= 15000.) then
          box_x = 1.0
        end

        z1 = math.abs(x["z"] + 7500)
        box_z = 0.5*(1.0+math.tanh(3000.0/(z1-10500.0) + 3000.0 / (z1-7500.0)))
        if (z1 >= 10500.0) then
          box_z = 0.0
        end
        if (z1 <= 7500.) then
          box_z = 1.0
        end

        r = math.sqrt(x["x"]^2 + x["y"]^2 + (x["z"]+7500)^2)

        -- strict '<': at r == 3000.0 exactly, r*r/(r*r - 9e6) divides by zero
        -- (Lua: +inf -> exp(+inf) = inf nucleation stress); the SCEC compact
        -- bell F(r) is defined for r < R and is 0 for r >= R.
        if (r < 3000.0) then
          nuc_xy = 45000000.0 * math.exp(r*r / (r*r - 9000000))
        else
          nuc_xy = 0.0
        end

        return {
          rs_a = 0.01 + 0.01 * (1.0 - box_x*box_z),
          rs_srW = 0.1 + 0.9 * (1.0 - box_x*box_z),
          nuc_xy = nuc_xy
        }
      end
[rs_sl0]: !ConstantMap
  map:
    rs_sl0: 0.4
