# =====================================================================
#  SCEC TPV104 200 m — PHASE-5 LTS SPEED / BENCHMARK deck (pure upwind, ADER-O4).
#
#  This file is one of a pair that differs in EXACTLY ONE LINE — the
#  `[numerics].lts` value:
#    tpv104_200m_lts_off.toml    ([numerics].lts = "off")   GTS baseline
#    tpv104_200m_lts_rate2.toml  ([numerics].lts = "rate2") clustered LTS
#  The Phase-5 sbatch asserts this one-line diff before running, so the two
#  runs cannot silently differ in anything but the time-stepping scheme.
#
#  PURPOSE (Phase 5): measure the REALIZED LTS speedup on the 200 m production
#  mesh (the representative size; the 1000 m coarse mesh is too small for 256
#  ranks — its fine clusters have fewer cells than ranks), and validate TPV104
#  benchmark physics under clustered LTS.  Compared three ways:
#    (1) MFEM-LTS  vs  MFEM-GTS  (this pair)   -> the realized speedup;
#    (2) MFEM-LTS  vs  SeisSol o4 on the same mesh (throughput);
#    (3) MFEM-LTS on-fault stations vs the SCEC TPV104 reference (physics).
#
#  Order-matched to SeisSol o4: order = 3 (p3), ader_order = 4.  Pure upwind
#  (mixed_flux="none") scalar Riemann is REQUIRED by LTS and matched by the GTS
#  baseline so the two differ only in the scheme.  Perf levers (--deriv-cache,
#  --shared-ck-recursion) are ON for BOTH runs (this is a throughput comparison,
#  not a bit-exact gate) — passed on the sbatch CLI, identical for both.
#
#  Derived from jobs/lts_canary/.../tpv104_spatial_lts_canary_rate2.toml
#  (physics oracle: drivers/tpv104_driver.cpp + config/tpv104_params.hpp).
# =====================================================================

[meta]
schema_version = 1
law            = "rate_state"
description    = "SCEC TPV104 200m Phase-5 LTS speed/benchmark (pure upwind, ADER-O4)."

[problem]
tag = "tpv104"   # selects the SCEC TPV104 on-fault station writer in spatial_dyn_driver

# Material: homogeneous, native TPV104Params (identical to TPV102/205).
[material_constant_fallback]
lambda = 32043759360.0
mu     = 32038120320.0
rho    = 2670.0

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

[mesh]
# 200 m fault-resolution PRODUCTION mesh (~126 MB, 2.46 M tets).  Path is the
# in-folder symlink, resolved from cwd = miniapps/seas (self-contained).
path  = "jobs/lts_phase5/tpv104_200m_lts_speed_expanse/mesh_tpv104_200m.msh"
order = 3

[velocity]
use_sidecar = false

[stress]
kind          = "fault_local_prestress"
tau_strike_pa = 40.0e6     # native TPV104 tau_ini (+ right-lateral)
tau_dip_pa    = 0.0
sigma_n_pa    = 120.0e6

[numerics]
lts            = "rate2"
ader_order     = 4
mixed_flux     = "none"     # LTS requires pure upwind; matched here for a like-for-like scheme
cfl            = 0.25
cfl_safety     = "dg"
interior_flux  = "scalar"
fault_iterator = "substep"
use_pml        = false

[time]
tfinal     = "12.0s"       # full TPV104 rupture window (sbatch overrides per run: GTS short, LTS full)
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.05s"

[output]
output_dir     = "output_tpv104_200m_phase5"
restart_prefix = "cp"
paraview_fault = "vtu"
paraview_fault_dt = "0.05s"

# Rate-and-state, slip law with strong rate weakening (FVW; native TPV104).
[friction.rate_state]
a_default       = 0.01
b_default       = 0.014
Dc_default      = 0.4
V_0_default     = 1.0e-6
f_0_default     = 0.6
V_init_default  = 1.0e-16
sigma_n_default = 120.0e6
state_evolution = "slip_law_strong_rate_weakening"
f_w_default     = 0.2
V_w_default     = 0.1
eta             = "auto"

# Velocity-strengthening border via the native SCEC smooth boxcar taper.
[[friction.rate_state.spatial]]
kind              = "boxcar_taper"
a_inner           = 0.01
a_outer           = 0.02
V_w_inner         = 0.1
V_w_outer         = 1.0
boxcar_center_x_m = 0.0
boxcar_half_x_m   = 15000.0
boxcar_trans_x_m  = 3000.0
boxcar_center_z_m = -7500.0
boxcar_half_z_m   = 7500.0
boxcar_trans_z_m  = 3000.0

# Nucleation: SCEC compact-bell gradual overstress (TPV104), strike-only.
[nucleation]
kind = "gradual_overstress_compact_circular"

[nucleation.gradual_overstress_compact_circular]
center_x_m   = 0.0
center_y_m   = 0.0
center_z_m   = -7500.0
radius_m     = 3000.0
delta_tau_pa = 45.0e6
T_nuc_s      = "1.0s"

[boundary]
fault_attr      = 3
natural_attrs   = [1]
absorbing_attrs = [5]

[fault_geometry]
ref_normal = [0.0, -1.0, 0.0]
up         = [0.0,  0.0, 1.0]
kind       = "vertical_strike_slip"

[hypocenter]
x_m                 = 0.0
y_m                 = 0.0
z_m                 = -7500.0
nucleation_radius_m = 3000.0
