# QD speed-up plan v2, item A (integrator study): today's tableau with
# PETSc's DSP step controller, filter PI42 (Soderlind 2003), at today's
# tolerance.  DSP accepts a step on its step ratio (>= 0.81), not on
# error <= 1 as the basic controller does, so it accepts larger errors;
# the study reads it at equal accuracy, not at equal atol.
-ts_type rk
-ts_rk_type 5dp
-ts_rtol 1e-50
-ts_atol 1e-7
-ts_adapt_type dsp
-ts_adapt_dsp_filter PI42
-ts_adapt_wnormtype infinity
-ts_adapt_dt_max 3.15576e6
