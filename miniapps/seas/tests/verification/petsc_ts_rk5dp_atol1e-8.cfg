# QD speed-up plan v2, item A (integrator study): today's tableau and
# controller at atol 1e-8.  With petsc_ts_rk45_tandem.cfg (1e-7) it gives
# the cost-accuracy line of today's setting, against which the other
# tableaus and the DSP controller are read at equal accuracy.
-ts_type rk
-ts_rk_type 5dp
-ts_rtol 1e-50
-ts_atol 1e-8
-ts_adapt_wnormtype infinity
-ts_adapt_dt_max 3.15576e6
