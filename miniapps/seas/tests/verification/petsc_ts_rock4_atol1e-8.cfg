# QD speed S3: ROCK4 (solver/ts_rock4.hpp), an explicit order-4 method whose
# stage count follows h times the spectral radius, at today's accuracy
# setting for the fully dynamic cycle (atol 1e-8, as
# petsc_ts_rk5dp_atol1e-8.cfg), the same controller and step cap.
-ts_type rock4
-ts_rtol 1e-50
-ts_atol 1e-8
-ts_adapt_wnormtype infinity
-ts_adapt_dt_max 3.15576e6
