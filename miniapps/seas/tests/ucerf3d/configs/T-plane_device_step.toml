# tests/ucerf3d/configs/T-plane_device_step.toml - UCERF 3-D plan rev5, P1.7,
# test U-G1 (tests/ucerf3d/test_device_cycle_3d.cpp): a dynamic phase on
# T-plane (a vertical 40 x 20 km fault) with the event started at t = 0 by a
# V_init patch of 1 m/s, stepped on the host and on the mfem device
# ([cycle].device_step, which the test sets from its --device option).  The
# outer walls absorb ([cycle.absorbing] faces = "outer"): the device step has
# no Dirichlet loading until P1.11.  The QD keys are read by the deck parser
# only: the test runs no QD step.

[meta]
schema_version = 1
law            = "rate_state"
description    = "T-plane: the dynamic phase on the device against the host (U-G1)."

[material_constant_fallback]
lambda = 32038120320.0
mu     = 32038120320.0
rho    = 2670.0

[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

[mesh]
path  = "ucerf3d/mesh/T-plane.msh"
order = 1

[velocity]
use_sidecar = false

[stress]
kind          = "fault_local_prestress"
tau_strike_pa = 0.0
tau_dip_pa    = 0.0
sigma_n_pa    = 25.0e6

[numerics]
cfl       = 0.5
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

[time]
tfinal     = 1.0e3
dt_initial = 0.01

[output]
output_dir = "."

[boundary]
fault_attr    = 3
natural_attrs = [1]

[fault_geometry]
ref_normal      = [0.0, -1.0, 0.0]
up              = [0.0,  0.0, 1.0]
kind            = "vertical_strike_slip"
orientation     = "propagated"
pin_by          = "reference"
tangent         = "pointwise"
junction_policy = "refuse"
pin_min_margin  = 0.1

[friction.rate_state]
a_default       = 0.004
b_default       = 0.03
Dc_default      = 0.14
V_0_default     = 1.0e-6
f_0_default     = 0.6
V_init_default  = 1.0e-9
sigma_n_default = 25.0e6
state_evolution = "aging_law"
eta             = "auto"

[cycle]
ic                   = "scec_fd"
switching            = true
qd_radiation_damping = true
mesh_scale           = 1.0
plate_rate           = 1.0e-9
penalty_factor       = 1.0

[cycle.switch]
V_on               = 1.0e-2
V_off              = 1.0e-3
T_dwell            = 10.0
T_min              = 0.0
T_max              = 1200.0
max_dynamic_phases = 1

[cycle.absorbing]
faces = "outer"

[cycle.qd]
solver        = "mumps"
petsc_options = "tests/verification/petsc_ts_rk45_tandem.cfg"
ts_atol       = 1.0e-7
ts_rtol       = 1.0e-50

[cycle.prestress]
V_background = 1.0e-9
eta_V_init   = true       # tau0 balances V_init with the radiation term

[cycle.fields]
V_init_dip = 1.0e-20

[cycle.fields.a]
center  = [0.0, 0.0, -9.0e3]
axis1   = [1.0, 0.0, 0.0]
axis2   = [0.0, 0.0, 1.0]
half1   = 14.0e3
half2   = 6.0e3
taper   = 2.0e3
inside  = 0.004
outside = 0.04

[cycle.fields.Dc]
center  = [0.0, 0.0, -9.0e3]
axis1   = [1.0, 0.0, 0.0]
axis2   = [0.0, 0.0, 1.0]
half1   = 0.0
half2   = 0.0
inside  = 0.14
outside = 0.14

[cycle.fields.V_init]
center  = [-6.0e3, 0.0, -9.0e3]
axis1   = [1.0, 0.0, 0.0]
axis2   = [0.0, 0.0, 1.0]
half1   = 6.0e3
half2   = 6.0e3
taper   = 0.0
eps     = 1.0e-3
inside  = 1.0        # m/s: the patch starts at seismic slip rate, so the rupture runs at once
outside = 1.0e-9

[cycle.output]
prefix       = "T-plane_device_step"
fast_V       = 1.0e-3
dt_fast      = 0.1
dt_slow      = 3155760.0
event_V      = 1.0e-3
event_dwell  = 10.0
plane_origin = [0.0, 0.0, 0.0]
plane_axis1  = [1.0, 0.0, 0.0]
plane_axis2  = [0.0, 0.0, -1.0]
