# =====================================================================
#  SCEC TPV105-2D — rate and state, slip law with strong rate weakening,
#  and thermal pressurization, on a 2-D triangle mesh, run through the
#  Nitsche dynamic-rupture driver (seas_nitsche_dyn_driver; 2D in-plane
#  design rev 3, phase D part 2, gate G2).
#
#  TPV105 (SCEC_validation_TPV105.pdf) is TPV104's law plus thermal
#  pressurization (eqs 11-12), with its own initial shear stress and
#  nucleation; "parameters are only given for the 2D problem".  The 2-D
#  problem is the line y = 7.5 km of the 3-D fault (through the hypocentre):
#  plane strain, mode II.  So this deck is tpv104/configs/tpv104_nitsche.toml
#  (the validated 3-D deck of the same law) with:
#
#   - the 2-D mesh tpv105/mesh/tpv105_2d_100m.msh (x along strike, y fault
#     normal; the fault on y = 0 crosses the whole 140 x 100 km box, since the
#     description gives it no end; all four sides absorbing, tag 5);
#   - TPV105's 2-D initial values: tau_ini = 21 MPa (sigma_xy = +21 MPa with
#     nhat = (0, -1), as TPV104's +40 MPa), effective sigma_ini = 120 MPa
#     (total 200 MPa less p_ini = 80 MPa), V_ini = 1e-16 m/s, psi_ini from
#     eq 13 (the driver seeds psi from the friction condition at the
#     projected prestress, which is eq 13);
#   - a and V_w: 0.01 + Delta a(x), 0.1 m/s + Delta V_w(x), Delta a0 = 0.01,
#     Delta V_w0 = 0.9 m/s, through the smooth box B(x; W = 15 km, w = 3 km)
#     (eqs 8-10); in 2-D the factor B(y - y0; W/2, w) is 1 (y = y0), so the
#     boxcar is tapered in x only;
#   - nucleation (eqs 16-18): delta_tau_0 = 60 MPa, R = 1.5 km, T = 1 s at
#     the hypocentre x0 = -10.5 km (a fault vertex of the 100 m mesh);
#   - thermal pressurization (the TPV105 table): alpha_th 1e-6 m^2/s, alpha_hy
#     1e-4 m^2/s, rho_c 2.7 MJ/(m^3 K), Lambda 0.1 MPa/K, h 10 mm, T_ini
#     483.15 K, p_ini 80 MPa, on the z grid of review 7 (dz0 = h/20, growth
#     1.05, z_max 0.4 m: 77 unknowns per fault DOF, T and p on the fault
#     within 3.4e-4 of the analytic solution at these steps);
#   - the seven 2-D stations tpv105/stations/tpv105_2d_fault_stations.csv
#     (x = 0, +-9, +-15, +-18 km), with the T and p columns;
#   - 15 s; no fault ParaView output (the 2-D fault is a polyline; phase F).
#
#  Regularization as in the TPV104 deck: Kelvin-Voigt (eta_bar 0.1, h_e = the
#  2-D CFL length 4 A / P) and Prakash-Clifton (v* = 1 m/s, L = 0.01 m; the
#  law sees sigma* - (p - p_ini)).  The medium's initial motion +-V_ini/2
#  (eq 15) is left out, as in the TPV104 deck (1e-16 m/s).
#
#  Consistency check (design 5.9 (ii)): Lambda = 0 must give the run without
#  [friction.thermal_pressurization] bit for bit in every column but T.
#
#  The 100 m mesh is committed; others from tpv105/mesh/tpv105_2d.geo (from
#  miniapps/seas, pythonenv):
#    gmsh -2 tpv105/mesh/tpv105_2d.geo -format msh22 -setnumber lc_fault 50 \
#         -o tpv105/mesh/tpv105_2d_50m.msh
#
#  Scope: Chunhui Zhao, 2026-10-26.
# =====================================================================

[meta]
schema_version = 1
law            = "rate_state"
description    = "SCEC TPV105-2D (RS slip law, strong rate weakening, thermal pressurization; plane strain) via the Nitsche dynamic-rupture driver on a 2-D triangle mesh."

[problem]
tag = "tpv105_2d"   # output file prefix

# Material: homogeneous, rho = 2670, cs = 3464, cp = 6000 (as TPV104).
[material_constant_fallback]
lambda = 32043759360.0
mu     = 32038120320.0
rho    = 2670.0

# The Nitsche driver's [pore_pressure] stays 0: the stress below is already
# effective; the pore-pressure CHANGE comes from thermal pressurization.
[pore_pressure]
P_p_pa            = 0.0
P_p_grad_pa_per_m = 0.0
min_sigma_n_pa    = 0.0

[mesh]
path  = "tpv105/mesh/tpv105_2d_100m.msh"
order = 1

[velocity]
use_sidecar = false

# Effective prestress, global Cauchy tensor (x along strike, y fault normal),
# TENSION POSITIVE: with nhat = (0, -1) the SCEC along-strike shear is +21 MPa
# and sigma_n = 120 MPa.
[stress]
kind        = "constant_tensor"
sigma_xx_pa = 0.0
sigma_yy_pa = -120.0e6
sigma_zz_pa = 0.0
sigma_xy_pa = 21.0e6
sigma_yz_pa = 0.0
sigma_xz_pa = 0.0

[numerics]
cfl            = 0.5        # fraction of C(p), the 2-D column on triangles
penalty_factor = 1.0
# Kelvin-Voigt damping (Day et al. 2005 A8): beta_e = kv_eta (1/3) (h_e/p) / c_s,e, h_e = 4A/P in 2-D
kv_eta    = 0.1
kv_scale  = "node"
kv_length = "inscribed"

[time]
tfinal     = "15s"
t_initial  = 0.0
dt_initial = "auto"
dt_max     = "0.05s"

[output]
output_dir             = "output_tpv105_2d_nitsche"
restart_prefix         = "cp"
paraview_enabled       = false
paraview_fault         = "off"   # 2-D fault snapshots are phase F
paraview_free_surface  = "off"

# On-fault stations, snapped to the nearest fault node; on the 100 m mesh
# every station is a fault vertex (0 m).
[output.stations]
file             = "tpv105/stations/tpv105_2d_fault_stations.csv"
snap_tolerance_m = 100.0

# Rate and state, slip law with strong rate weakening (TPV104/TPV105 eqs 2-7):
#   b = 0.014, L (Dc) = 0.4 m, f_0 = 0.6, V_0 = 1e-6 m/s, V_ini = 1e-16 m/s,
#   f_w = 0.2; a and V_w per node from the boxcar_taper rule below.
[friction.rate_state]
a_default       = 0.01
b_default       = 0.014
Dc_default      = 0.4
V_0_default     = 1.0e-6
f_0_default     = 0.6
V_init_default  = 1.0e-16
sigma_n_default = 120.0e6
state_evolution = "slip_law_strong_rate_weakening"
f_w_default     = 0.2       # required by the Nitsche driver
V_w_default     = 0.1
eta             = "auto"

# Velocity-strengthening outside |x| < W + w: the SCEC smooth box (eqs 8-10)
# blends a_inner / V_w_inner into a_outer / V_w_outer over w = 3 km, in x only.
[[friction.rate_state.spatial]]
kind              = "boxcar_taper"
a_inner           = 0.01      # 0.01
a_outer           = 0.02      # 0.01 + Delta a0
V_w_inner         = 0.1       # m/s
V_w_outer         = 1.0       # 0.1 + Delta V_w0, m/s
boxcar_center_x_m = 0.0
boxcar_half_x_m   = 15000.0   # W
boxcar_trans_x_m  = 3000.0    # w

# Thermal pressurization (TPV105 eqs 11-12 and its table; the driver header).
[friction.thermal_pressurization]
alpha_th = 1.0e-6      # m^2/s
alpha_hy = 1.0e-4      # m^2/s
rho_c    = 2.7e6       # J/(m^3 K)
Lambda   = 0.1e6       # Pa/K
h        = 0.01        # m
T_ini    = 483.15      # K
p_ini    = 80.0e6      # Pa
dz0      = 0.5e-3      # m, h/20
growth   = 1.05
z_max    = 0.4         # m, 10 sqrt(alpha_hy 15 s)
scheme   = "backward_euler"

# Nucleation (eqs 16-18): compact bell, strike overstress delta_tau F(r) G(t).
[nucleation]
kind = "gradual_overstress_compact_circular"

[nucleation.gradual_overstress_compact_circular]
center_x_m   = -10500.0
center_y_m   = 0.0
center_z_m   = 0.0
radius_m     = 1500.0
delta_tau_pa = 60.0e6
T_nuc_s      = "1.0s"

[boundary]
fault_attr      = 3
natural_attrs   = []
absorbing_attrs = [5]

[fault_geometry]
ref_normal        = [0.0, -1.0]
up                = [0.0,  0.0, 1.0]
kind              = "vertical_strike_slip"
orientation       = "propagated"
pin_by            = "reference"
tangent           = "pointwise"
junction_policy   = "refuse"
pin_min_margin    = 0.1

[hypocenter]
x_m                 = -10500.0
y_m                 = 0.0
z_m                 = 0.0
nucleation_radius_m = 1500.0

[diagnostics]
energy_balance = false

[friction.prakash_clifton]
v_star = 1.0      # m/s
length = 0.01     # m
