# CMAME revision, 3D hydromechanical, 5 J pulses, normal-strain permeability.
#   farms@cdms pulsepower/cmame_revision/3d_hydromech/em_5J/elasticity_mesh2x.i
#   + fracture_mesh2x.i
# Pierced cylinder (3d_mesh/cylinder_sample.geo); dashpots and 1 MPa confinement
# on the outer surface only; HHT alpha = 0.1 in MOOSE (Newmark beta 1/4).

[case]
name = "cmame_3d_hydromech_em_5J"
model = "hydromech"
source = "pulsepower/cmame_revision/3d_hydromech/em_5J/elasticity_mesh2x.i"

[mesh]
file = "../3d_mesh/cylinder_sample.msh"
dim = 3
corner = [0.1, 0.1, 0.0]

[boundaries]
pressure = [3]
confinement = [4]
absorbing = [4]

[material]
E = 50e9
nu = 0.3
density = 2600

[phase_field]
model = "AT1"
Gc = 40
l = 2e-4
eta = 1e-6
p = 2
decomposition = "spectral"
driving = "half_history_enhanced"

[pulse]
shape_alpha = 4.658e5
shape_beta = 4.661e5
rise_time = 3e-6
pulse_duration = 1e-5
EM = 0.005
gap = 0.008
efficiency = 1.0
kappa = 0.35
m_exp = 0.25
base_factor = 8000
center = [0.0, 0.0, 0.03]
num_pulses = 50

[confinement]
pressure = 1e6
# MOOSE: u = 0 and pp = p0 at t = 0, then one step of dt = 1e-8 without inertia,
# dashpots and pulse ([Controls] period0), so the pore pressure follows the
# static compression undrained (no static_solve file, unlike the 2D inputs).
initial_state = "static_undrained"       # the step is [time] dt_max

[time]
mass = "consistent"                      # MOOSE ADInertialForce (Andy 2026-11-22; lumped grows ~20% more damage at zeta_pulse = 0)
end_time = 50e-5
cfl = 0.4
dt_max = 1e-8

[poro]
K_s = 50e9
K_f = 2.24e9
phi0 = 0.008
phi_lb = 0.008
phi_ub = 0.999
g_min = 1e-6
viscosity = 1e-3
fluid_density = 1000
initial_pore_pressure = 0.0965e6
porosity_model = "damage"
permeability_model = "normal_strain"     # Heider 2021: w_c = h_c |1 + n.eps.n|, K_frac = w^2/12 (I - n n)
k0 = 5e-19
perm_exponent = 10
d_threshold = 0.5
fc = 1.0
anisotropic = true
normal_source = "damage_gradient"

[output]
directory = "out/cmame_3d_hydromech_em_5J"
interval = 100
fields = ["d", "vel_mag", "pp"]

[metrics]
r_hole = 1.6e-3
