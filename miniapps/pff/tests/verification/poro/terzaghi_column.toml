# Poro verification 2: Terzaghi consolidation of the column of undrained_column.toml.
# Step pressure P on the top from t = 0, top drained (p = 0), sides and bottom
# sealed, d = 0 (run with -fd). Mass-proportional damping (alpha_mass, on from
# t = 0 through t_free = 0) removes the waves of the step load; it is near
# critical for the first column mode, 2 omega_1 = pi c_u / L.
#   undrained start  p0 = alpha M P / H_u,   H_u = K + 4G/3 + alpha^2 M
#   c_v = (k/mu) M (K + 4G/3) / H_u
#   p(y, t) = p0 sum_m 4/((2m+1) pi) sin((2m+1) pi (L - y) / 2L) exp(-(2m+1)^2 pi^2 c_v t / 4L^2)
# The csv column p_max is the pressure at the sealed bottom. k0 puts
# T_v = c_v t / L^2 = 0.5 at the end time. See check_poro_verification.py.

[case]
name = "terzaghi_column"
model = "hydromech"
source = "verification (no MOOSE input): Terzaghi consolidation, one-way drainage"

[mesh]
file = "column_L10_h0p25.msh"            # make_column_mesh.py --L 0.01 --W 0.0005 --ny 40 --nx 2
dim = 2
corner = [0.0, 0.0, 0.0]

[boundaries]
pressure = []
absorbing = []
drained = ["top"]
fixed_x = ["left", "right"]
fixed_y = ["bottom"]
confinement = ["top"]

[material]
E = 10e9
nu = 0.3
density = 2600

[phase_field]
model = "AT1"
Gc = 100
l = 2e-4
eta = 1e-6
p = 2
decomposition = "spectral"
driving = "half_history_enhanced"

[pulse]                                  # no pulse (EM = 0); one window = the run
shape_alpha = 4.658e5
shape_beta = 4.661e5
rise_time = 3e-6
pulse_duration = 2e-3
EM = 0.0
gap = 0.008
num_pulses = 1

[damping]
t_free = 0.0
quench = "mass"
alpha_mass = 8.8e5                       # pi c_u / L, c_u = 2794 m/s

[confinement]
pressure = 1e6

[time]
mass = "consistent"
end_time = 2e-3
cfl = 0.4

[poro]
K_s = 50e9
K_f = 2.24e9
phi0 = 0.2
phi_lb = 0.2
phi_ub = 0.999
g_min = 1e-6
viscosity = 1e-3
permeability_model = "none"
k0 = 3.84e-15
preconditioner = "jacobi"

[output]
directory = "out/terzaghi_column"
